<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Couleur des barres système en appli installée (Android les peint avec ;
         iOS, lui, échantillonne `.status-bar-sampler`, cf. plus bas). Elle miroite
         `--color-space-edge` de styles/space.css — la teinte vers laquelle le
         décor spatial tend à ses bords — pour que la barre de navigation basse
         ne se lise pas comme une bande grise sous le décor. -->
    <meta name="theme-color" content="#080a13" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` et non `black-translucent` : depuis iOS 27, une appli installée
         en `black-translucent` reçoit un dégradé flouté sur toute la safe area du
         haut, qui passe sur le header. ⚠️ La meta est FIGÉE à l'installation : une
         appli ajoutée avant ce changement reste en `black-translucent` tant qu'on
         ne la réinstalle pas (d'où la garde de app/viewportHeight.ts). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Millenium" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@400;500;600;700&family=Comic+Neue:ital,wght@0,700;1,700&family=Dela+Gothic+One&display=swap" rel="stylesheet" />
    <title>Millenium</title>
  </head>
  <body>
    <!-- Un VRAI élément fixe tout en haut : iOS teinte la barre d'état d'après la
         `background-color` de ce qu'il trouve là (un pseudo-élément lui est
         invisible). Teinte du header, cf. `.status-bar-sampler` (styles/index.css). -->
    <div class="status-bar-sampler" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
