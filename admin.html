function _attrEffectFieldVisibility(type) {
  return {
    showStat: ['stat_bonus', 'stat_modifier'].includes(type),
    showValuePer: ['stat_bonus', 'shield'].includes(type),
    showTrigger: type === 'stat_modifier',
    showMax: ['draw_bonus', 'board_slot_bonus'].includes(type),
    showTarget: type === 'revive',
    showHpPercent: type === 'revive',
    showCategory: type === 'guaranteed_draw',
    showValue: !['guaranteed_draw', 'effect_immunity'].includes(type),
  };
}

function renderEffectBlock(ef, ti, ei) {
  const type = ef.type || 'stat_bonus';
  const v = _attrEffectFieldVisibility(type);
  const valuePerOptions = ['active_unit', ...attributes.map(a => a.id)];
  return `
    <div class="effect-block" id="ef-${ti}-${ei}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <div class="field" style="flex:1"><label>Type</label>
          <select id="ef-${ti}-${ei}-type" onchange="updateEffectFields(${ti},${ei})">
            <option value="stat_bonus" ${type === 'stat_bonus' ? 'selected' : ''}>Bonus de stat</option>
            <option value="stat_modifier" ${type === 'stat_modifier' ? 'selected' : ''}>Modificateur de stat (sur trigger)</option>
            <option value="draw_bonus" ${type === 'draw_bonus' ? 'selected' : ''}>Pioche supplémentaire</option>
            <option value="guaranteed_draw" ${type === 'guaranteed_draw' ? 'selected' : ''}>Pioche garantie (par catégorie)</option>
            <option value="revive" ${type === 'revive' ? 'selected' : ''}>Réanimation (%HP)</option>
            <option value="shield" ${type === 'shield' ? 'selected' : ''}>Bouclier</option>
            <option value="board_slot_bonus" ${type === 'board_slot_bonus' ? 'selected' : ''}>Slot de board supplémentaire</option>
            <option value="damage_multiplier_bonus" ${type === 'damage_multiplier_bonus' ? 'selected' : ''}>Multiplicateur de dégât supplémentaire (fin de combat)</option>
            <option value="effect_immunity" ${type === 'effect_immunity' ? 'selected' : ''}>Immunité aux effets négatifs (poison, paralysie, push, burn…)</option>
          </select>
        </div>
        <button class="btn btn-danger btn-sm" style="margin-top:16px" onclick="removeEffect(${ti},${ei})">×</button>
      </div>
      <div class="form-grid" id="ef-${ti}-${ei}-fields">
        <div class="field" id="ef-${ti}-${ei}-stat-field" style="${v.showStat ? '' : 'display:none'}">
          <label>Stat ciblée</label>
          <select id="ef-${ti}-${ei}-stat">
            ${ATTR_EFFECT_STATS.map(s => `<option value="${s}" ${ef.stat === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="field" id="ef-${ti}-${ei}-trigger-field" style="${v.showTrigger ? '' : 'display:none'}">
          <label>Déclencheur</label>
          <select id="ef-${ti}-${ei}-trigger">
            ${ATTR_EFFECT_TRIGGERS.map(t => `<option value="${t}" ${ef.trigger === t ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="field" id="ef-${ti}-${ei}-value-field" style="${v.showValue ? '' : 'display:none'}">
          <label>Valeur</label>
          <input id="ef-${ti}-${ei}-value" type="number" step="any" value="${ef.value ?? 0}">
        </div>
        <div class="field" id="ef-${ti}-${ei}-valueper-field" style="${v.showValuePer ? '' : 'display:none'}">
          <label>Multiplié par (optionnel)</label>
          <select id="ef-${ti}-${ei}-valueper">
            <option value="" ${!ef.value_per ? 'selected' : ''}>— Aucun —</option>
            ${valuePerOptions.map(id => `<option value="${id}" ${ef.value_per === id ? 'selected' : ''}>${id === 'active_unit' ? 'active_unit (unités alliées vivantes)' : id}</option>`).join('')}
          </select>
        </div>
        <div class="field" id="ef-${ti}-${ei}-max-field" style="${v.showMax ? '' : 'display:none'}">
          <label>Maximum (optionnel)</label>
          <input id="ef-${ti}-${ei}-max" type="number" min="1" value="${ef.max ?? ''}">
        </div>
        <div class="field" id="ef-${ti}-${ei}-target-field" style="${v.showTarget ? '' : 'display:none'}">
          <label>Cible</label>
          <select id="ef-${ti}-${ei}-target">
            ${ATTR_EFFECT_TARGETS.map(t => `<option value="${t}" ${ef.target === t ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="field" id="ef-${ti}-${ei}-hppercent-field" style="${v.showHpPercent ? '' : 'display:none'}">
          <label>% PV max</label>
          <input id="ef-${ti}-${ei}-hppercent" type="number" min="1" max="100" value="${ef.hp_percent ?? 50}">
        </div>
        <div class="field" id="ef-${ti}-${ei}-category-field" style="${v.showCategory ? '' : 'display:none'}">
          <label>Catégorie d'invocation</label>
          <select id="ef-${ti}-${ei}-category">
            ${ATTR_EFFECT_CATEGORIES.map(c => `<option value="${c}" ${ef.category === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
  `;
}

function updateEffectFields(ti, ei) {
  const type = document.getElementById(`ef-${ti}-${ei}-type`).value;
  const v = _attrEffectFieldVisibility(type);
  document.getElementById(`ef-${ti}-${ei}-stat-field`).style.display = v.showStat ? '' : 'none';
  document.getElementById(`ef-${ti}-${ei}-trigger-field`).style.display = v.showTrigger ? '' : 'none';
  document.getElementById(`ef-${ti}-${ei}-value-field`).style.display = v.showValue ? '' : 'none';
  document.getElementById(`ef-${ti}-${ei}-valueper-field`).style.display = v.showValuePer ? '' : 'none';
  document.getElementById(`ef-${ti}-${ei}-max-field`).style.display = v.showMax ? '' : 'none';
  document.getElementById(`ef-${ti}-${ei}-target-field`).style.display = v.showTarget ? '' : 'none';
  document.getElementById(`ef-${ti}-${ei}-hppercent-field`).style.display = v.showHpPercent ? '' : 'none';
  document.getElementById(`ef-${ti}-${ei}-category-field`).style.display = v.showCategory ? '' : 'none';
}

function _collectEffectFromFields(ti, ei) {
  const type = document.getElementById(`ef-${ti}-${ei}-type`).value;
  const v = _attrEffectFieldVisibility(type);
  const ef = { type };
  if (v.showStat) ef.stat = document.getElementById(`ef-${ti}-${ei}-stat`).value;
  if (v.showTrigger) ef.trigger = document.getElementById(`ef-${ti}-${ei}-trigger`).value;
  if (v.showValue) ef.value = parseFloat(document.getElementById(`ef-${ti}-${ei}-value`).value) || 0;
  if (v.showValuePer) {
    const valuePer = document.getElementById(`ef-${ti}-${ei}-valueper`).value;
    if (valuePer) ef.value_per = valuePer;
  }
  if (v.showMax) {
    const max = document.getElementById(`ef-${ti}-${ei}-max`).value;
    if (max) ef.max = parseInt(max);
  }
  if (v.showTarget) ef.target = document.getElementById(`ef-${ti}-${ei}-target`).value;
  if (v.showHpPercent) ef.hp_percent = parseInt(document.getElementById(`ef-${ti}-${ei}-hppercent`).value) || 0;
  if (v.showCategory) {
    ef.category = document.getElementById(`ef-${ti}-${ei}-category`).value;
    ef.attribute = selectedAttr.id; // guaranteed_draw se réfère toujours à l'attribut courant
  }
  return ef;
}

function addThreshold() {
  if (!selectedAttr.thresholds) selectedAttr.thresholds = [];
  selectedAttr.thresholds.push({ count: 2, medal: 'silver', effects: [{ type: 'stat_bonus', stat: 'atk', value: 1 }] });
  renderAttrDetail();
}

function removeThreshold(ti) {
  selectedAttr.thresholds.splice(ti, 1);
  renderAttrDetail();
}

function addEffect(ti) {
  if (!selectedAttr.thresholds[ti].effects) selectedAttr.thresholds[ti].effects = [];
  selectedAttr.thresholds[ti].effects.push({ type: 'stat_bonus', stat: 'atk', value: 1 });
  renderAttrDetail();
}

function removeEffect(ti, ei) {
  selectedAttr.thresholds[ti].effects.splice(ei, 1);
  renderAttrDetail();
}

function collectAttrFromForm() {
  const thresholds = (selectedAttr.thresholds || []).map((th, ti) => {
    const effects = (th.effects || []).map((ef, ei) => _collectEffectFromFields(ti, ei));
    return {
      count: parseInt(document.getElementById(`th-${ti}-count`).value),
      medal: document.getElementById(`th-${ti}-medal`).value,
      effects,
    };
  });
  const cat = getAttrCategoryValue();
  return {
    id: document.getElementById('af-id').value.trim(),
    name: document.getElementById('af-name').value.trim(),
    icon: document.getElementById('af-icon').value.trim(),
    timing: document.getElementById('af-timing').value,
    ...(cat ? { categorie: cat } : {}),
    thresholds,
  };
}

async function saveAttribute() {
  const updated = collectAttrFromForm();
  const oldId = selectedAttr.id;
  const res = await apiFetch(`/api/attributes/${oldId}`, { method: 'PUT', body: updated });
  if (res.error) return toast(res.error, 'err');
  const idx = attributes.findIndex(a => a.id === oldId);
  attributes[idx] = updated;
  selectedAttr = updated;
  filterAttributes();
  renderAttrDetail();
  toast('Attribut enregistré');
}

async function deleteAttribute() {
  if (!confirm(`Supprimer "${selectedAttr.name}" ?`)) return;
  const res = await apiFetch(`/api/attributes/${selectedAttr.id}`, { method: 'DELETE' });
  if (res.error) return toast(res.error, 'err');
  attributes = attributes.filter(a => a.id !== selectedAttr.id);
  selectedAttr = null;
  filterAttributes();
  document.getElementById('attr-detail').innerHTML = '<div class="empty"><span>Sélectionne un attribut</span></div>';
  showList();
  toast('Attribut supprimé');
}

function openNewAttribute() {
  const nextNum = attributes.reduce((max, a) => {
    const m = a.id.match(/ARCH_(\d+)/);
    return m ? Math.max(max, parseInt(m[1])) : max;
  }, 0) + 1;
  selectedAttr = {
    id: `ARCH_${String(nextNum).padStart(3, '0')}`,
    name: '', icon: '', timing: 'start_of_combat', thresholds: [],
  };
  isNewAttr = true;
  renderAttrList();
  renderAttrDetail();
  showDetail();
}

async function submitNewAttribute() {
  const attr = collectAttrFromForm();
  if (!attr.id || !attr.name) return toast('ID et nom requis', 'err');
  const res = await apiFetch('/api/attributes', { method: 'POST', body: attr });
  if (res.error) return toast(res.error, 'err');
  attributes.push(attr);
  selectedAttr = attr;
  isNewAttr = false;
  filterAttributes();
  renderAttrDetail();
  toast('Attribut créé');
}

function cancelNewAttr() {
  selectedAttr = null;
  isNewAttr = false;
  filterAttributes();
  document.getElementById('attr-detail').innerHTML = '<div class="empty"><span>Sélectionne un attribut</span></div>';
  showList();
}

  const showStat = ['stat_bonus', 'stat_modifier'].includes(type);
  const showTier = type === 'guaranteed_draw';
  const noValue = ['none', 'guaranteed_draw', 'defuse_fusion', 'destroy_unit', 'free_transformation', 'remove_heritage_material'];
  const showValue = !noValue.includes(type);
  document.getElementById('mf-stat-field').style.display = showStat ? '' : 'none';
  document.getElementById('mf-value-field').style.display = showValue ? '' : 'none';
  document.getElementById('mf-tier-field').style.display = showTier ? '' : 'none';
}

function _collectMagieFields() {
  const effectType = document.getElementById('mf-effect-type')?.value || 'none';
  let effect = null;
  const noValue = ['defuse_fusion', 'destroy_unit', 'free_transformation', 'remove_heritage_material'];
  if (effectType !== 'none') {
    effect = { type: effectType };
    if (effectType === 'guaranteed_draw') {
      effect.tier = parseInt(document.getElementById('mf-effect-tier')?.value) || 1;
    } else if (!noValue.includes(effectType)) {
      effect.value = parseFloat(document.getElementById('mf-effect-value')?.value) || 0;
    }
    if (['stat_bonus', 'stat_modifier'].includes(effectType)) {
      effect.stat = document.getElementById('mf-effect-stat')?.value || 'atk';
    }
  }
  return {
    id: document.getElementById('mf-id')?.value.trim() || '',
    name: document.getElementById('mf-name')?.value.trim() || '',
    effect,
  };
}

// ================== STATS ==================
const STAT_LABELS = { atk: 'ATK', hp: 'HP', movement_speed: 'Déplacement', attack_speed: 'Vit. Attaque', initiative: 'Initiative', range: 'Portée' };
const STAT_KEYS = ['atk', 'hp', 'movement_speed', 'attack_speed', 'initiative', 'range'];
const TIER_COLORS = { 1: '#78c8a8', 2: '#6ab4e8', 3: '#c878e0', 4: '#f0a040', 5: '#f05050' };

const COMPOSITE_STATS = [
  { key: 'offensive', label: 'Score Offensif', formula: 'ATK × (100 / Vit. Attaque)', color: '#f05050', note: 'Dégâts sur 100 ticks', compute: s => (s.atk != null && s.attack_speed != null) ? s.atk * (100 / s.attack_speed) : null },
  { key: 'defensive', label: 'Ratio Défensif',  formula: 'ATK / HP',            color: '#6ab4e8', note: 'Élevé = glass canon · Faible = tank', compute: s => (s.atk != null && s.hp != null && s.hp > 0) ? s.atk / s.hp : null },
  { key: 'mobility',  label: 'Score Mobilité',  formula: 'Déplacement / Portée', color: '#78c8a8', note: 'Mobilité relative à la portée', compute: s => (s.movement_speed != null && s.range != null && s.range > 0) ? s.movement_speed / s.range : null }
];

let statsFilterTier = 0;
let statsThreshold = 1.5;
let statsPowerExpanded = null;
let statsPowerDetailId = null;

function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }
function stdDev(arr) {
  if (arr.length < 2) return 0;
  const m = mean(arr);
  return Math.sqrt(arr.reduce((s, v) => s + (v - m) ** 2, 0) / arr.length);
}

function computeTierStats() {
  const result = {};
  [1,2,3,4,5].forEach(tier => {
    const tc = cards.filter(c => Math.round(c.tier) === tier && c.stats);
    result[tier] = { count: tc.length, stats: {} };
    STAT_KEYS.forEach(key => {
      const vals = tc.map(c => c.stats[key]).filter(v => v != null && !isNaN(v));
      const m = mean(vals), s = stdDev(vals);
      result[tier].stats[key] = { avg: m, std: s, min: vals.length ? Math.min(...vals) : 0, max: vals.length ? Math.max(...vals) : 0 };
    });
  });
  return result;
}

function detectOutliers(tierStats) {
  const out = [];
  cards.forEach(card => {
    if (!card.stats) return;
    const tier = Math.round(card.tier);
    const ts = tierStats[tier];
    if (!ts) return;
    STAT_KEYS.forEach(key => {
      const v = card.stats[key];
      if (v == null || isNaN(v)) return;
      const { avg: m, std: s, min, max } = ts.stats[key];
      if (s < 0.5) return;
      const z = (v - m) / s;
      if (Math.abs(z) >= statsThreshold) out.push({ card, stat: key, value: v, avg: m, std: s, min, max, z });
    });
  });
  return out.sort((a, b) => Math.abs(b.z) - Math.abs(a.z));
}

function computeCompositeTierStats() {
  const result = {};
  [1,2,3,4,5].forEach(tier => {
    const tc = cards.filter(c => Math.round(c.tier) === tier && c.stats);
    result[tier] = { count: tc.length };
    COMPOSITE_STATS.forEach(cs => {
      const vals = tc.map(c => cs.compute(c.stats)).filter(v => v != null && !isNaN(v) && isFinite(v));
      const m = mean(vals), s = stdDev(vals);
      result[tier][cs.key] = { avg: m, std: s, min: vals.length ? Math.min(...vals) : 0, max: vals.length ? Math.max(...vals) : 0, count: vals.length };
    });
  });
  return result;
}

function detectCompositeOutliers(compTierStats) {
  const out = [];
  cards.forEach(card => {
    if (!card.stats) return;
    const tier = Math.round(card.tier);
    const ts = compTierStats[tier];
    if (!ts) return;
    COMPOSITE_STATS.forEach(cs => {
      const v = cs.compute(card.stats);
      if (v == null || isNaN(v) || !isFinite(v)) return;
      const { avg: m, std: s, min, max } = ts[cs.key];
      if (s < 0.01) return;
      const z = (v - m) / s;
      if (Math.abs(z) >= statsThreshold) out.push({ card, cs, value: v, avg: m, std: s, min, max, z });
    });
  });
  return out.sort((a, b) => Math.abs(b.z) - Math.abs(a.z));
}

function detectBrokenLinks() {
  const attrIds = new Set(attributes.map(a => a.id));
  const powerIds = new Set(powers.map(p => p.id));
  const cardIds = new Set(cards.map(c => c.id));
  const broken = [];
  for (const card of cards) {
    for (const aid of (card.attributes || [])) {
      if (!attrIds.has(aid)) broken.push({ card, type: 'attribute', refId: aid });
    }
    if (card.power?.id && !powerIds.has(card.power.id)) {
      broken.push({ card, type: 'power', refId: card.power.id });
    }
    for (const mid of (card.cost?.materials || [])) {
      const valid = cardIds.has(mid) || (card.summon_type === 'heritage' && attrIds.has(mid));
      if (!valid) broken.push({ card, type: 'material', refId: mid });
    }
  }
  return broken;
}

function computePowerStats() {
  const byPower = powers.map(p => {
    const used = cards.filter(c => c.power?.id === p.id);
    const tierCounts = [1,2,3,4,5].map(t => used.filter(c => Math.round(c.tier) === t).length);
    return { power: p, cards: used, count: used.length, tierCounts };
  }).sort((a, b) => b.count - a.count);
  const noPower = cards.filter(c => !c.power?.id);
  const noPowerTierCounts = [1,2,3,4,5].map(t => noPower.filter(c => Math.round(c.tier) === t).length);
  return { byPower, noPower, noPowerTierCounts };
}

function togglePowerExpand(key) {
  statsPowerExpanded = statsPowerExpanded === key ? null : key;
  renderStats();
}

function setStatsPowerDetail(id) {
  statsPowerDetailId = id || null;
  renderStats();
}

function renderStats() {
  const el = document.getElementById('stats-content');
  const ts = computeTierStats();
  const outliers = detectOutliers(ts);
  const filteredOutliers = statsFilterTier ? outliers.filter(o => Math.round(o.card.tier) === statsFilterTier) : outliers;

  const cts = computeCompositeTierStats();
  const compOutliers = detectCompositeOutliers(cts);
  const filteredCompOutliers = statsFilterTier ? compOutliers.filter(o => Math.round(o.card.tier) === statsFilterTier) : compOutliers;
  const fmtC = v => v >= 10 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v.toFixed(3);

  const tierRow = (key) => [1,2,3,4,5].map(tier => {
    const s = ts[tier].stats[key];
    if (!s || ts[tier].count === 0) return '<td style="color:var(--muted)">—</td>';
    const col = TIER_COLORS[tier];
    return `<td>
      <div class="stat-val">${s.avg.toFixed(1)}</div>
      <div class="stat-range">${s.min.toFixed(0)}–${s.max.toFixed(0)} <span style="color:var(--muted)">±${s.std.toFixed(1)}</span></div>
      <div class="mini-bar-wrap" style="margin-top:3px">
        <div class="mini-bar-track">
          <div class="mini-bar-fill" style="left:0;width:100%;background:${col};opacity:.18"></div>
          <div class="mini-bar-fill" style="
            left:${s.max > s.min ? ((s.avg - s.std - s.min)/(s.max - s.min)*100).toFixed(1) : 0}%;
            width:${s.max > s.min ? (s.std * 2 / (s.max - s.min) * 100).toFixed(1) : 100}%;
            background:${col};opacity:.5;max-width:100%
          "></div>
          <div class="mini-bar-fill" style="
            left:${s.max > s.min ? ((s.avg - s.min)/(s.max - s.min)*100).toFixed(1) : 50}%;
            width:2px;background:${col};opacity:1
          "></div>
        </div>
      </div>
    </td>`;
  }).join('');

  const overviewTable = `
    <div class="stat-panel" style="margin-bottom:20px">
      <h3>Synthèse par Tier</h3>
      <div style="overflow-x:auto">
        <table class="tier-overview-table">
          <thead>
            <tr>
              <th>Stat</th>
              ${[1,2,3,4,5].map(t => `<th style="color:${TIER_COLORS[t]}">Tier ${t} <span style="font-weight:400;color:var(--muted)">(${ts[t].count})</span></th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${STAT_KEYS.map(key => `<tr><td style="font-weight:600;color:var(--muted);white-space:nowrap">${STAT_LABELS[key]}</td>${tierRow(key)}</tr>`).join('')}
          </tbody>
        </table>
      </div>

  const tierChips = `
    <div class="tier-filter-chips">
      <span style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px">Tier :</span>

  const anomalyRows = filteredOutliers.length === 0

      </div>
      ${filteredOutliers.map(o => {
        const tier = Math.round(o.card.tier);
        const col = TIER_COLORS[tier];
        const range = o.max - o.min;
        const pos = range > 0 ? ((o.value - o.min) / range * 100).toFixed(1) : 50;
        const avgPos = range > 0 ? ((o.avg - o.min) / range * 100).toFixed(1) : 50;
        const isHigh = o.z > 0;

        const zClass = severity >= 2.5 ? 'z-high' : 'z-mild';

            </div>

            <div class="anomaly-col-val">

            <div class="anomaly-col-pos">

  const compTierRow = (cs) => [1,2,3,4,5].map(tier => {

                </div>

                  <span style="color:var(--muted);font-size:12px"> vs ${fmtC(o.avg)}</span>

            </div>

            <div class="anomaly-col-stat">

            </div>
            <div class="anomaly-col-val">
              <span class="${isHigh ? 'direction-high' : 'direction-low'}" style="font-weight:700">${isHigh ? '▲' : '▼'} ${fmtC(o.value)}</span>

            </div>
            <div><span class="z-chip ${zClass}">${severity.toFixed(1)}σ</span></div>
          </div>

  const brokenLinks = detectBrokenLinks();
  const TYPE_LABEL = { attribute: 'Attribut', power: 'Pouvoir', material: 'Matériel' };
  const TYPE_COLOR = { attribute: '#a78bfa', power: '#fb923c', material: '#34d399' };
  const brokenRows = brokenLinks.length === 0
    ? `<div class="no-anomalies">✅ Aucun lien manquant</div>`
    : brokenLinks.map(b => {
        const col = TYPE_COLOR[b.type] || 'var(--accent)';
        return `
          <div class="broken-link-row" onclick="jumpToCard('${b.card.id}')">

  const { byPower, noPower, noPowerTierCounts } = computePowerStats();

  const hasValue = detailCards.some(c => c.power.value != null);

    ? `<div class="no-anomalies">Aucune carte n'utilise ce pouvoir</div>`
    : `
      <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">

      </div>

      <h3>Liens manquants <span style="font-size:11px;font-weight:400;color:var(--muted)">(${brokenLinks.length} référence${brokenLinks.length !== 1 ? 's' : ''} vers des IDs introuvables)</span></h3>
      <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
        ${brokenRows}
      </div>
    </div>

}

function setStatsFilter(tier) {
  statsFilterTier = tier;
  renderStats();
}

function setThreshold(val) {
  statsThreshold = parseFloat(val);
  document.getElementById('threshold-val').textContent = statsThreshold.toFixed(1) + 'σ';
  const ts = computeTierStats();
  const outliers = detectOutliers(ts);
  const filtered = statsFilterTier ? outliers.filter(o => Math.round(o.card.tier) === statsFilterTier) : outliers;
  // Re-render just the anomaly count + rows
  renderStats();
}

function jumpToCard(id) {
  switchTab('cards');
  selectCard(id);
  // Scroll card into view in sidebar
  setTimeout(() => {
    const item = document.querySelector(`#card-list .list-item.selected`);
    if (item) item.scrollIntoView({ block: 'nearest' });
  }, 50);
}

// ================== IMPORT JSON ==================
// ---- Sélection / modifications de masse ----
function toggleSelectionMode() {
  selectionMode = !selectionMode;
  if (!selectionMode) bulkSelected.clear();
  const btn = document.getElementById('btn-select-mode');
  if (btn) btn.textContent = selectionMode ? 'Terminer' : 'Sélectionner';
  filterCards();
  renderMassToolbar();
}

function toggleCardSelection(id) {
  if (bulkSelected.has(id)) bulkSelected.delete(id);
  else bulkSelected.add(id);
  const item = document.querySelector(`.list-item[data-id="${id}"]`);
  if (item) {
    item.classList.toggle('bulk-selected', bulkSelected.has(id));
    const check = item.querySelector('.bulk-check');
    if (check) {
      check.classList.toggle('checked', bulkSelected.has(id));
      check.innerHTML = bulkSelected.has(id) ? `<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5 L4 7 L8 3" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>` : '';
    }
  }
  renderMassToolbar();
}

function selectAllVisible() {
  document.querySelectorAll('.list-item[data-id]').forEach(el => bulkSelected.add(el.dataset.id));
  filterCards();
  renderMassToolbar();
}

function deselectAll() {
  bulkSelected.clear();
  filterCards();
  renderMassToolbar();
}

function renderMassToolbar() {
  const toolbar = document.getElementById('mass-toolbar');
  if (!toolbar) return;
  if (!selectionMode) { toolbar.style.display = 'none'; return; }
  const n = bulkSelected.size;
  const dis = n === 0 ? 'disabled' : '';
  toolbar.style.display = '';
  toolbar.innerHTML = `
    <div class="mass-toolbar">
      <div class="mass-toolbar-top">
        <span class="mass-toolbar-count">${n} carte${n > 1 ? 's' : ''} sélectionnée${n > 1 ? 's' : ''}</span>
        <span style="display:flex;gap:4px">
          <button class="btn btn-secondary btn-sm" onclick="selectAllVisible()" style="padding:2px 8px;font-size:11px">Tout</button>
          <button class="btn btn-secondary btn-sm" onclick="deselectAll()" style="padding:2px 8px;font-size:11px">Aucun</button>
        </span>
      </div>
      <div class="mass-toolbar-actions">
        <button class="btn btn-secondary btn-sm" onclick="openMassEditModal()" ${dis}>Modifier un champ</button>
        <button class="btn btn-secondary btn-sm" onclick="openMassAttrModal()" ${dis}>Attribut</button>
        <button class="btn btn-danger btn-sm" onclick="confirmMassDelete()" ${dis}>Supprimer (${n})</button>
      </div>
    </div>`;
}

function openMassEditModal() {
  const n = bulkSelected.size;
  showModal(`
    <h2>Modifier en masse <span style="font-size:13px;font-weight:400;color:var(--muted)">${n} carte${n>1?'s':''}</span></h2>
    <div class="field"><label>Champ</label>
      <select id="mass-field" onchange="onMassFieldChange()">
        <option value="tier">Tier</option>
        <option value="summon_type">Type d'invocation</option>
        <option value="power">Pouvoir</option>
      </select>
    </div>
    <div id="mass-value-wrap" class="field"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="applyMassEdit()">Appliquer</button>
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
    </div>
  `);
  onMassFieldChange();
}

function onMassFieldChange() {
  const field = document.getElementById('mass-field')?.value;
  const wrap = document.getElementById('mass-value-wrap');
  if (!wrap) return;
  if (field === 'tier') {
    wrap.innerHTML = `<label>Tier</label><select id="mass-value">${[1,2,3,4,5].map(t=>`<option value="${t}">${t}</option>`).join('')}</select>`;
  } else if (field === 'summon_type') {
    wrap.innerHTML = `<label>Type d'invocation</label><select id="mass-value">${['normal','sacrifice','fusion','heritage','transformation'].map(s=>`<option value="${s}">${summonLabel(s)}</option>`).join('')}</select>`;
  } else if (field === 'power') {
    wrap.innerHTML = `<label>Pouvoir</label><select id="mass-value"><option value="">Aucun</option>${powers.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`;
  }
}

async function applyMassEdit() {
  const field = document.getElementById('mass-field')?.value;
  const value = document.getElementById('mass-value')?.value;
  closeModal();
  const ids = [...bulkSelected];
  for (const id of ids) {
    const card = cards.find(c => c.id === id);
    if (!card) continue;
    const updated = { ...card };
    delete updated._has_illustration;
    if (field === 'tier') updated.tier = parseInt(value);
    else if (field === 'summon_type') updated.summon_type = value;
    else if (field === 'power') updated.power = value ? { id: value, power_speed: updated.power?.power_speed || 0, value: updated.power?.value ?? null } : {};
    await fetch(`/api/cards/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updated) });
  }
  toast(`${ids.length} carte${ids.length>1?'s':''} modifiée${ids.length>1?'s':''}`, 'ok');
  cards = await apiFetch('/api/cards'); filterCards(); renderMassToolbar();
}

function openMassAttrModal() {
  const n = bulkSelected.size;
  showModal(`
    <h2>Attributs en masse <span style="font-size:13px;font-weight:400;color:var(--muted)">${n} carte${n>1?'s':''}</span></h2>
    <div class="field"><label>Action</label>
      <select id="mass-attr-action">
        <option value="add">Ajouter</option>
        <option value="remove">Retirer</option>
      </select>
    </div>
    <div class="field"><label>Attribut</label>
      <select id="mass-attr-id">${attributes.map(a=>`<option value="${a.id}">${esc((a.icon||'')+' '+a.name)}</option>`).join('')}</select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="applyMassAttribute()">Appliquer</button>
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
    </div>
  `);
}

async function applyMassAttribute() {
  const action = document.getElementById('mass-attr-action')?.value;
  const attrId = document.getElementById('mass-attr-id')?.value;
  if (!attrId) return;
  closeModal();
  const ids = [...bulkSelected];
  for (const id of ids) {
    const card = cards.find(c => c.id === id);
    if (!card) continue;
    const updated = { ...card };
    delete updated._has_illustration;
    const attrs = [...(updated.attributes || [])];
    if (action === 'add' && !attrs.includes(attrId)) attrs.push(attrId);
    else if (action === 'remove') { const i = attrs.indexOf(attrId); if (i !== -1) attrs.splice(i, 1); }
    updated.attributes = attrs;
    await fetch(`/api/cards/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updated) });
  }
  toast(`${ids.length} carte${ids.length>1?'s':''} mise${ids.length>1?'s':''} à jour`, 'ok');
  cards = await apiFetch('/api/cards'); filterCards(); renderMassToolbar();
}

async function confirmMassDelete() {
  const n = bulkSelected.size;
  if (!confirm(`Supprimer ${n} carte${n>1?'s':''} ? Cette action est irréversible.`)) return;
  const ids = [...bulkSelected];
  await Promise.all(ids.map(id => fetch(`/api/cards/${id}`, { method: 'DELETE' })));
  bulkSelected.clear();
  if (selectedCard && ids.includes(selectedCard.id)) { selectedCard = null; document.getElementById('card-detail').innerHTML = `<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><span>Sélectionne une carte</span></div>`; }
  toast(`${ids.length} carte${ids.length>1?'s':''} supprimée${ids.length>1?'s':''}`, 'ok');
  cards = await apiFetch('/api/cards'); filterCards(); renderMassToolbar();
}

let importType = null;
let importItems = null;

const IMPORT_LABELS = { cards: 'cartes', attributes: 'attributs', powers: 'pouvoirs', boards: 'terrains', magies: 'magies' };

function openImportModal(type) {
  importType = type;
  importItems = null;
  showModal(`
    <h2>Importer des ${IMPORT_LABELS[type]}</h2>
    <p style="color:var(--muted);font-size:12px;margin-bottom:14px">
      Sélectionne un fichier JSON contenant un tableau d'objets ou un objet avec une clé <code>${type}</code>.
    </p>
    <div class="field">
      <label>Fichier JSON</label>
      <input type="file" id="import-file" accept=".json" onchange="previewImport()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;width:100%">
    </div>
    <div id="import-preview" class="hidden" style="margin-top:12px">
      <div id="import-preview-info" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:12px"></div>
      <div class="field">
        <label>En cas de doublon (même ID)</label>
        <select id="import-mode">
          <option value="skip">Ignorer (conserver l'existant)</option>
          <option value="replace">Remplacer (écraser l'existant)</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" id="import-confirm-btn" disabled onclick="confirmImport()">Importer</button>
    </div>
  `);
}

function previewImport() {
  const file = document.getElementById('import-file')?.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      let parsed = JSON.parse(e.target.result);
      if (Array.isArray(parsed)) {
        importItems = parsed;
      } else if (parsed && Array.isArray(parsed[importType])) {
        importItems = parsed[importType];
      } else {
        importItems = null;
        toast('Format invalide : tableau attendu', 'err');
        return;
      }
      const preview = document.getElementById('import-preview');
      const info = document.getElementById('import-preview-info');
      const btn = document.getElementById('import-confirm-btn');
      if (preview) preview.classList.remove('hidden');
      if (info) info.textContent = `${importItems.length} élément${importItems.length !== 1 ? 's' : ''} trouvé${importItems.length !== 1 ? 's' : ''} dans le fichier.`;
      if (btn) btn.disabled = false;
    } catch {
      importItems = null;
      toast('Fichier JSON invalide', 'err');
    }
  };
  reader.readAsText(file);
}

async function confirmImport() {
  if (!importItems || !importType) return;
  const mode = document.getElementById('import-mode')?.value || 'skip';
  closeModal();
  const endpoint = `/api/${importType}/import`;
  const res = await apiFetch(endpoint, { method: 'POST', body: { items: importItems, mode } });
  if (res.error) return toast(res.error, 'err');

  // Reload data from server
  if (importType === 'cards') {
    cards = await apiFetch('/api/cards');
    filterCards();
  } else if (importType === 'attributes') {
    attributes = await apiFetch('/api/attributes');
    filterAttributes();
  } else if (importType === 'powers') {
    powers = await apiFetch('/api/powers');
    filterPowers();
  } else if (importType === 'boards') {
    boards = await apiFetch('/api/boards');
    filterBoards();
  } else if (importType === 'magies') {
    magies = await apiFetch('/api/magies');
    filterMagies();
  }

  const parts = [];
  if (res.added)    parts.push(`${res.added} ajouté${res.added !== 1 ? 's' : ''}`);
  if (res.replaced) parts.push(`${res.replaced} remplacé${res.replaced !== 1 ? 's' : ''}`);
  if (res.skipped)  parts.push(`${res.skipped} ignoré${res.skipped !== 1 ? 's' : ''}`);
  toast(`Import terminé : ${parts.join(', ') || 'aucun changement'}`);
}

// ================== BOARDS ==================
let _boardBlockedSet = new Set();

function filterBoards() {
  const q = document.getElementById('board-search').value.toLowerCase();
  const filtered = boards.filter(b => !q || b.name.toLowerCase().includes(q) || b.id.toLowerCase().includes(q));
  renderBoardList(filtered);
}

function renderBoardList(list = boards) {
  document.getElementById('board-count').textContent = list.length;
  document.getElementById('board-list').innerHTML = list.map(b => `
    <div class="list-item ${selectedBoard && selectedBoard.id === b.id ? 'selected' : ''}" onclick="selectBoard('${b.id}')">
      ${b._has_illustration
        ? `<img src="/illustrations/${b.id}" style="width:40px;height:40px;object-fit:cover;border-radius:4px;flex-shrink:0" loading="lazy">`
        : `<div style="width:40px;height:40px;background:var(--surface2);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px">🗺️</div>`}
      <div style="min-width:0">
        <div class="item-name">${esc(b.name)}</div>
        <div class="item-id">${b.id}${b.blocked_cells?.length ? ` · ${b.blocked_cells.length} case${b.blocked_cells.length>1?'s':''} bloquée${b.blocked_cells.length>1?'s':''}` : ''}</div>
      </div>
    </div>
  `).join('');
}

function selectBoard(id) {
  selectedBoard = boards.find(b => b.id === id);
  isNewBoard = false;
  renderBoardList();
  renderBoardDetail();
  showDetail();
}

    <button class="back-btn" onclick="showList()">Retour à la liste</button>
    <div class="detail-title" style="margin-bottom:16px">🗺️ ${esc(b.name)}</div>

    <div class="section-title">Identité</div>
    <div class="form-grid">
      <div class="field"><label>ID</label><input id="bf-id" value="${esc(b.id)}"></div>
      <div class="field"><label>Nom</label><input id="bf-name" value="${esc(b.name)}"></div>
    </div>

    <div class="section-title" style="margin-top:20px">Effet</div>
    <div class="form-grid">
      <div class="field">
        <label>Type</label>
        <select id="bf-effect-type" onchange="toggleBoardEffectFields()">
          <option value="">Aucun effet</option>
          <option value="stat_bonus"    ${e?.type==='stat_bonus'   ?'selected':''}>Bonus de stat</option>
          <option value="stat_modifier" ${e?.type==='stat_modifier'?'selected':''}>Modificateur de stat</option>
          <option value="shield"        ${e?.type==='shield'       ?'selected':''}>Bouclier</option>
          <option value="draw_bonus"    ${e?.type==='draw_bonus'   ?'selected':''}>Bonus de pioche</option>
        </select>
      </div>
      <div class="field" id="bf-stat-wrap" style="${needsStat?'':'display:none'}">
        <label>Stat</label>
        <select id="bf-effect-stat">${statOpts}</select>
      </div>
      <div class="field" id="bf-value-wrap" style="${e?.type?'':'display:none'}">
        <label>Valeur</label>
        <input type="number" id="bf-effect-value" value="${e?.value ?? 0}">
      </div>
    </div>
    <div id="bf-target-wrap" style="${e?.type?'':'display:none'}">
      <div class="section-title" style="margin-top:20px">Attributs cibles <span style="font-size:10px;font-weight:400;color:var(--muted)">(vide = tous les attributs)</span></div>
      <div class="attr-chips" id="bf-attr-chips">
        ${(e?.target_attributes || []).map(aid => `
          <span class="attr-chip" data-aid="${aid}" onclick="removeBoardTargetAttr('${aid}')">
            ${getAttrName(aid)} <span class="remove">×</span>
          </span>
        `).join('')}
        <button class="attr-add" onclick="openBoardAttrPickModal()">+ Ajouter</button>
      </div>
    </div>

    <div class="section-title" style="margin-top:20px">Cellules bloquées (zone neutre)</div>
    <p style="color:var(--muted);font-size:12px;margin-bottom:8px">Cliquez pour bloquer/débloquer une cellule.</p>
    <div id="bf-blocked-grid" style="display:inline-grid;grid-template-columns:repeat(5,28px);gap:2px;margin-bottom:4px"></div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:16px" id="bf-blocked-count">${_boardBlockedSet.size} cellule${_boardBlockedSet.size!==1?'s':''} bloquée${_boardBlockedSet.size!==1?'s':''}</div>

    <div class="section-title" style="margin-top:4px">Illustration</div>
    <div class="detail-header" style="margin-bottom:16px">
      <div class="illustration-box" onclick="openBoardIllusModal()">
        ${b._has_illustration
          ? `<img src="/illustrations/${b.id}?t=${Date.now()}" alt="">`
          : `<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" opacity=".3"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>`}
        <div class="illus-overlay">
          ${b._has_illustration ? `<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteBoardIllustration()">Supprimer</button>` : ''}
          <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openBoardIllusModal()">Importer URL</button>
        </div>
      </div>
    </div>

    <div class="actions">
      ${isNewBoard
        ? `<button class="btn btn-success" onclick="createBoard()">Créer le terrain</button>
           <button class="btn btn-secondary" onclick="cancelNewBoard()">Annuler</button>`
        : `<button class="btn btn-primary" onclick="saveBoard()">Enregistrer</button>
           <button class="btn btn-danger" onclick="deleteBoard()">Supprimer</button>`}
    </div>
  `;
  _renderBlockedCellsGrid();
}

function toggleBoardEffectFields() {
  const type = document.getElementById('bf-effect-type').value;
  const needsStat = type === 'stat_bonus' || type === 'stat_modifier';
  document.getElementById('bf-stat-wrap').style.display   = needsStat ? '' : 'none';
  document.getElementById('bf-value-wrap').style.display  = type ? '' : 'none';
  document.getElementById('bf-target-wrap').style.display = type ? '' : 'none';
}

function removeBoardTargetAttr(aid) {
  const chip = document.querySelector(`#bf-attr-chips .attr-chip[data-aid="${aid}"]`);
  if (chip) chip.remove();
}

function openBoardAttrPickModal() {
  const current = [...document.querySelectorAll('#bf-attr-chips .attr-chip')].map(el => el.dataset.aid);
  showModal(`
    <h2>Ajouter un attribut cible</h2>
    <div style="display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto">
      ${attributes.filter(a => !current.includes(a.id)).map(a => `
        <div class="list-item" style="border-radius:6px" onclick="addBoardTargetAttr('${a.id}')">
          <span style="font-size:16px">${a.icon || ''}</span>
          <div><div>${esc(a.name)}</div><div style="font-size:11px;color:var(--muted);font-family:monospace">${a.id}</div></div>
        </div>
      `).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Fermer</button></div>
  `);
}

function addBoardTargetAttr(aid) {
  const chipsEl = document.getElementById('bf-attr-chips');
  if (!chipsEl || chipsEl.querySelector(`[data-aid="${aid}"]`)) { closeModal(); return; }
  const addBtn = chipsEl.querySelector('.attr-add');
  const chip = document.createElement('span');
  chip.className = 'attr-chip';
  chip.dataset.aid = aid;
  chip.onclick = () => removeBoardTargetAttr(aid);
  chip.innerHTML = `${getAttrName(aid)} <span class="remove">×</span>`;
  chipsEl.insertBefore(chip, addBtn);
  closeModal();
}

function _renderBlockedCellsGrid() {
  const grid = document.getElementById('bf-blocked-grid');
  if (!grid) return;
  grid.innerHTML = '';
  for (let row = 6; row >= 4; row--) {
    for (let col = 0; col < 5; col++) {
      const key = `${col},${row}`;
      const isBlocked = _boardBlockedSet.has(key);
      const cell = document.createElement('div');
      cell.title = `col ${col}, row ${row}`;
      cell.style.cssText = `width:28px;height:28px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:${isBlocked?'#4a4a4a':'#1a1a2e'};border:1px solid ${isBlocked?'#aaa':'#333'};font-size:13px;`;
      cell.textContent = isBlocked ? '✕' : '';
      cell.addEventListener('click', () => {
        if (_boardBlockedSet.has(key)) _boardBlockedSet.delete(key);
        else _boardBlockedSet.add(key);
        const countEl = document.getElementById('bf-blocked-count');
        if (countEl) countEl.textContent = `${_boardBlockedSet.size} cellule${_boardBlockedSet.size!==1?'s':''} bloquée${_boardBlockedSet.size!==1?'s':''}`;
        _renderBlockedCellsGrid();
      });
      grid.appendChild(cell);
    }
  }
}

function _collectBoardFields() {
  const type = document.getElementById('bf-effect-type').value;
  let effect = null;
  if (type) {
    const needsStat = type === 'stat_bonus' || type === 'stat_modifier';
    effect = { type, value: +document.getElementById('bf-effect-value').value };
    if (needsStat) effect.stat = document.getElementById('bf-effect-stat').value;
    effect.target_attributes = [...document.querySelectorAll('#bf-attr-chips .attr-chip')].map(el => el.dataset.aid);
  }
  return {
    id:            document.getElementById('bf-id').value.trim(),
    name:          document.getElementById('bf-name').value.trim(),
    effect,
    blocked_cells: [..._boardBlockedSet].map(k => { const [c,r] = k.split(','); return { col:+c, row:+r }; }),
  };
}

async function saveBoard() {
  const updated = _collectBoardFields();
  if (!updated) return;
  const oldId = selectedBoard.id;
  const res = await apiFetch(`/api/boards/${oldId}`, { method: 'PUT', body: updated });
  if (res.error) return toast(res.error, 'err');
  const idx = boards.findIndex(b => b.id === oldId);
  boards[idx] = { ...updated, _has_illustration: selectedBoard._has_illustration };
  selectedBoard = boards[idx];
  filterBoards();
  renderBoardDetail();
  toast('Terrain enregistré');
}

async function deleteBoard() {
  if (!confirm(`Supprimer "${selectedBoard.name}" ?`)) return;
  const res = await apiFetch(`/api/boards/${selectedBoard.id}`, { method: 'DELETE' });
  if (res.error) return toast(res.error, 'err');
  boards = boards.filter(b => b.id !== selectedBoard.id);
  selectedBoard = null;
  filterBoards();
  document.getElementById('board-detail').innerHTML = '<div class="empty"><span>Sélectionne un terrain</span></div>';
  showList();
  toast('Terrain supprimé');
}

function openNewBoard() {
  const nextNum = String(boards.length + 1).padStart(3, '0');
  selectedBoard = { id: `BOARD_${nextNum}`, name: '', effect: null, blocked_cells: [], _has_illustration: false };
  isNewBoard = true;
  renderBoardList();
  renderBoardDetail();
  showDetail();
}

async function createBoard() {
  const board = _collectBoardFields();
  if (!board) return;
  if (!board.id || !board.name) return toast('ID et nom requis', 'err');
  const res = await apiFetch('/api/boards', { method: 'POST', body: board });
  if (res.error) return toast(res.error, 'err');
  boards.push({ ...board, _has_illustration: false });
  selectedBoard = boards[boards.length - 1];
  isNewBoard = false;
  filterBoards();
  renderBoardDetail();
  toast('Terrain créé');
}

function cancelNewBoard() {
  selectedBoard = null;
  isNewBoard = false;
  filterBoards();
  document.getElementById('board-detail').innerHTML = '<div class="empty"><span>Sélectionne un terrain</span></div>';
  showList();
}

function openBoardIllusModal() {
  const boardName = selectedBoard?.name || '';
  const defaultQuery = `yugioh illustration ${boardName}`.trim();
  showModal(`
    <h2 style="margin-bottom:16px">Illustration — ${esc(boardName)}</h2>

    <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;letter-spacing:.5px;margin-bottom:10px">Recherche Google Images</div>
      <div class="field" style="margin-bottom:10px">
        <label>Mots-clés</label>
        <input id="board-illus-q" value="${esc(defaultQuery)}" style="font-family:monospace;font-size:12px">
      </div>
      <button class="btn btn-secondary" onclick="openBoardImageSearch()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.28 5 12c0-4.2 3.29-7.27 7.19-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/></svg>
        Ouvrir Google Images ↗
      </button>
      <div style="margin-top:10px;font-size:11px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);padding-top:10px">
        Clic droit sur l'image souhaitée →
        <strong style="color:var(--text)">Copier l'adresse de l'image</strong>
        → coller dans le champ ci-dessous.
      </div>
    </div>

    <div class="field">
      <label>URL de l'image</label>
      <div style="display:flex;gap:6px">
        <input id="board-illus-url" type="text" placeholder="https://..." style="flex:1">
        <button class="btn btn-secondary btn-sm" onclick="pasteBoardIllusUrl()" title="Coller depuis le presse-papier" style="flex-shrink:0;font-size:16px;padding:0 10px">📋</button>
      </div>
      <span style="font-size:11px;color:var(--muted);margin-top:4px">Sauvegardée sous <code>${selectedBoard.id}.png</code></span>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="importBoardIllustration()">Importer</button>
    </div>
  `, 'wide');
}

function openBoardImageSearch() {
  const q = document.getElementById('board-illus-q')?.value || `yugioh illustration ${selectedBoard?.name || ''}`;
  window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}&tbm=isch`, '_blank');
}

async function pasteBoardIllusUrl() {
  try {
    const text = await navigator.clipboard.readText();
    const el = document.getElementById('board-illus-url');
    if (el) el.value = text;
  } catch {
    toast('Accès presse-papier refusé — collez manuellement (Ctrl+V)', 'err');
  }
}

async function importBoardIllustration() {
  const url = document.getElementById('board-illus-url').value.trim();
  if (!url) return toast('URL requise', 'err');
  closeModal();
  toast('Téléchargement en cours...', 'ok');
  const res = await apiFetch(`/api/boards/${selectedBoard.id}/illustration`, { method: 'POST', body: { url } });
  if (res.error) return toast(res.error, 'err');
  selectedBoard._has_illustration = true;
  const idx = boards.findIndex(b => b.id === selectedBoard.id);
  if (idx !== -1) boards[idx]._has_illustration = true;
  filterBoards();
  renderBoardDetail();
  renderBoardList();
  toast('Illustration importée');
}

async function deleteBoardIllustration() {
  if (!confirm('Supprimer l\'illustration ?')) return;
  const res = await apiFetch(`/api/boards/${selectedBoard.id}/illustration`, { method: 'DELETE' });
  if (res.error) return toast(res.error, 'err');
  selectedBoard._has_illustration = false;
  const idx = boards.findIndex(b => b.id === selectedBoard.id);
  if (idx !== -1) boards[idx]._has_illustration = false;
  renderBoardDetail();
  renderBoardList();
  toast('Illustration supprimée');
}

// ================== BOOT ==================
init();
</script>
</body>
</html>
