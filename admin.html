<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soulforge — Card Manager</title>
<link rel="icon" type="image/png" href="/game/favicon.png">
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d26;
  --surface2: #22263a;
  --border: #2d3148;
  --accent: #6c63ff;
  --accent2: #ff6584;
  --text: #e8eaf6;
  --muted: #8892b0;
  --tier1: #78c8a8;
  --tier2: #6ab4e8;
  --tier3: #c878e0;
  --tier4: #f0a040;
  --tier5: #f05050;
  --green: #4caf80;
  --red: #f04050;
  --yellow: #f0c040;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; overflow-x: hidden; }

/* Layout */
.app { display: flex; flex-direction: column; height: 100vh; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
.topbar h1 { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
.tabs { display: flex; gap: 4px; }
.tab { padding: 6px 16px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; transition: all .15s; border: none; background: none; font-size: 14px; }
.tab:hover { color: var(--text); background: var(--surface2); }
.tab.active { color: var(--text); background: var(--accent); }
.main { flex: 1; overflow: hidden; display: flex; }

/* Sidebar */
.sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.sidebar-list { flex: 1; overflow-y: auto; }
.list-item { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; transition: background .1s; }
.list-item:hover { background: var(--surface2); }
.list-item.selected { background: var(--surface2); border-left: 3px solid var(--accent); }
.list-item .item-id { font-size: 11px; color: var(--muted); font-family: monospace; }
.list-item .item-name { font-weight: 500; flex: 1; }
.list-item .item-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
.list-thumb { width: 36px; height: 48px; border-radius: 4px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); }
.list-thumb-placeholder { width: 36px; height: 48px; border-radius: 4px; flex-shrink: 0; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
.list-item.bulk-selected { background: var(--accent)18; border-left: 3px solid var(--accent); }
.bulk-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: border-color .15s, background .15s; }
.bulk-check.checked { border-color: var(--accent); background: var(--accent); }
.mass-toolbar { padding: 8px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.mass-toolbar-top { display: flex; justify-content: space-between; align-items: center; }
.mass-toolbar-count { font-size: 12px; color: var(--muted); }
.mass-toolbar-actions { display: flex; gap: 5px; flex-wrap: wrap; }

/* Content */
.content { flex: 1; overflow-y: auto; padding: 24px; }

/* Card detail */
.detail-header { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
.illustration-box { width: 120px; height: 120px; background: var(--surface2); border: 2px dashed var(--border); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; flex-shrink: 0; position: relative; overflow: hidden; }
.illustration-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
.illustration-box .illus-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; opacity: 0; transition: opacity .2s; }
.illustration-box:hover .illus-overlay { opacity: 1; }
.illus-text { font-size: 11px; color: var(--muted); text-align: center; }

.detail-info { flex: 1; }
.detail-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.detail-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
.badge-tier1 { background: #1a3a2e; color: var(--tier1); }
.badge-tier2 { background: #1a2e3a; color: var(--tier2); }
.badge-tier3 { background: #2e1a3a; color: var(--tier3); }
.badge-tier4 { background: #3a2a10; color: var(--tier4); }
.badge-tier5 { background: #3a1010; color: var(--tier5); }
.badge-summon { background: var(--surface2); color: var(--text); }
.badge-power { background: #1a2e3a; color: #88ccff; }
.badge-illus { background: #1a3a1a; color: var(--green); }
.badge-no-illus { background: #3a1a1a; color: var(--red); }

/* Form */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid.wide { grid-template-columns: 1fr; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
.field input, .field select, .field textarea {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 8px 10px; border-radius: 6px; font-size: 13px; outline: none; width: 100%;
  font-family: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 60px; }
.field select option { background: var(--surface2); }
.field input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; padding: 0; border: none; background: none; height: 20px; }
.field input[type=range]:focus { border-color: transparent; }
.slider-val { font-size: 12px; font-weight: 700; color: var(--accent); background: rgba(108,99,255,.15); border-radius: 4px; padding: 1px 6px; margin-left: 5px; font-family: monospace; }
.slider-marks { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 1px; }

.section-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 700; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.set-picker-row { display: flex; align-items: center; gap: 6px; }
.set-sep { font-size: 16px; font-weight: 700; color: var(--muted); flex-shrink: 0; padding: 0 2px; }
.set-num { width: 70px !important; text-align: center; font-family: monospace; flex-shrink: 0; }
.set-result-id { margin-top: 5px; font-family: monospace; font-size: 12px; background: var(--surface2); color: var(--muted); }
.cat-picker-row { display: flex; align-items: center; gap: 6px; }

/* Stats grid */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* Attribute chips */
.attr-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.attr-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.attr-chip:hover { border-color: var(--red); }
.attr-chip .remove { color: var(--red); font-weight: 700; }
.attr-add { background: none; border: 1px dashed var(--border); border-radius: 20px; padding: 3px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
.attr-add:hover { border-color: var(--accent); color: var(--accent); }

/* Materials list */
.materials-list { display: flex; flex-direction: column; gap: 6px; }
.material-item { display: flex; align-items: center; gap: 8px; background: var(--surface2); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); }
.material-item span { flex: 1; font-family: monospace; font-size: 12px; }
.material-item button { background: none; border: none; color: var(--red); cursor: pointer; font-size: 16px; line-height: 1; }

/* Buttons */
.btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .15s; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: #7b73ff; }
.btn-danger { background: var(--red); color: white; }
.btn-danger:hover { background: #ff5060; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-success { background: var(--green); color: white; }
.btn-success:hover { background: #5cbf90; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.actions { display: flex; gap: 10px; margin-top: 20px; }

/* Search / filter */
input[type=search], input[type=text].search { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px; outline: none; width: 100%; font-size: 13px; }
input[type=search]:focus { border-color: var(--accent); }
select.filter { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px; outline: none; font-size: 12px; }
select.filter:focus { border-color: var(--accent); }

/* Count badge */
.count { background: var(--surface2); color: var(--muted); font-size: 11px; padding: 2px 7px; border-radius: 10px; margin-left: auto; }

/* Modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
.deckbuilder-overlay { position: fixed; inset: 0; background: #0f1117; z-index: 110; display: flex; flex-direction: column; }
.deckbuilder-overlay iframe { flex: 1; width: 100%; border: none; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 460px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
.hidden { display: none !important; }

/* Toast */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); padding: 12px 20px; border-radius: 8px; z-index: 200; font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,.4); transition: opacity .3s; }
.toast.ok { border-left: 3px solid var(--green); }
.toast.err { border-left: 3px solid var(--red); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Attribute detail */
.threshold-block { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
.effect-block { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-top: 8px; }

/* Empty state */
.empty { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--muted); flex-direction: column; gap: 8px; }
.empty svg { opacity: .3; }

.illus-import { display: flex; gap: 6px; }
.illus-import input { flex: 1; }

/* FAB + Back button (mobile) */
.fab {
  display: none; position: fixed; bottom: 24px; right: 20px;
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--accent); color: #fff; font-size: 30px; line-height: 1;
  border: none; cursor: pointer; z-index: 90;
  align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(108,99,255,.55); transition: transform .15s;
}
.fab:active { transform: scale(.9); }
.back-btn {
  display: none; align-items: center; gap: 6px;
  background: none; border: none; color: var(--accent);
  font-size: 14px; font-weight: 700; padding: 0 0 14px; cursor: pointer;
}
.back-btn::before { content: '←'; font-size: 18px; }
.mobile-info { display: none; }

@media (max-width: 768px) {
  /* Topbar — wrap onto two lines so tabs never overflow the viewport */
  .topbar { padding: 8px 12px 0; gap: 6px; flex-wrap: wrap; }
  .topbar h1 { font-size: 14px; white-space: nowrap; }
  .tab { padding: 5px 9px; font-size: 12px; }
  .tabs { width: 100%; overflow-x: auto; flex-shrink: 0; padding-bottom: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }

  /* Single-panel layout */
  .main { position: relative; overflow: hidden; }
  .sidebar {
    width: 100%; position: absolute; inset: 0; z-index: 2;
    transition: transform .25s cubic-bezier(.4,0,.2,1);
  }
  .content {
    position: absolute; inset: 0; width: 100%; padding: 16px;
    background: var(--bg); overflow-y: auto;
    transform: translateX(105%);
    transition: transform .25s cubic-bezier(.4,0,.2,1);
  }
  .main.show-detail .sidebar  { transform: translateX(-105%); pointer-events: none; }
  .main.show-detail .content  { transform: translateX(0); pointer-events: auto; }

  /* Stats & DB tabs — no sidebar, always visible */
  #tab-stats .content,
  #tab-db .content {
    transform: none !important; position: relative !important;
    inset: auto !important; height: 100% !important;
  }

  /* FAB & back btn */
  .fab      { display: flex; }
  .back-btn { display: flex; }
  .mobile-info { display: flex; flex-direction: column; gap: 5px; }

  /* Forms: 1 column */
  .form-grid  { grid-template-columns: 1fr !important; gap: 10px; }
  .stats-grid { grid-template-columns: 1fr !important; }

  /* Touch-friendly inputs (16px prevents iOS zoom-in) */
  .field input, .field select, .field textarea {
    padding: 12px 10px; font-size: 16px;
  }
  select.filter { padding: 8px; font-size: 12px; }
  input[type=search] { font-size: 16px; padding: 10px; }

  /* List items — bigger tap target */
  .list-item { padding: 13px 14px; }

  /* Buttons */
  .btn { min-height: 44px; font-size: 14px; }
  .actions { flex-wrap: wrap; gap: 8px; }

  /* Illustration overlay always visible on touch */
  .illustration-box .illus-overlay { opacity: 1; }
  .illustration-box { width: 90px; height: 90px; }

  /* Stats */
  #tab-stats .content { padding: 12px !important; }
  .stat-panel { padding: 12px 10px; }
  .tier-overview-table { font-size: 11px; }
  .tier-overview-table th, .tier-overview-table td { padding: 5px 6px; }
  .mini-bar-track { min-width: 36px; }
  /* Sticky stat-name column so tier columns scroll under it */
  .tier-overview-table th:first-child,
  .tier-overview-table td:first-child {
    position: sticky; left: 0;
    background: var(--surface); z-index: 1;
    padding-right: 10px;
  }
  /* Hide mini-bars in table to save width */
  .tier-overview-table .mini-bar-wrap { display: none; }

  /* Threshold row: wrap, slider prend toute la largeur */
  .threshold-row { flex-wrap: wrap; gap: 6px; }
  .threshold-row input[type=range] { width: 100%; order: 3; }

  /* Anomaly rows mobile */
  .anomaly-header { display: none !important; }
  .anomaly-row {
    display: flex !important; align-items: flex-start; justify-content: space-between;
    gap: 12px; padding: 14px;
  }
  .anomaly-row .anomaly-col-pos,
  .anomaly-row .anomaly-col-tier,
  .anomaly-row .anomaly-col-stat,
  .anomaly-row .anomaly-col-val { display: none !important; }
  .anomaly-row .anomaly-col-card { flex: 1; min-width: 0; }
  .anomaly-col-id { display: none; }
  /* Card name: wrap autorisé sur 2 lignes */
  .anomaly-name { white-space: normal !important; overflow: visible !important; text-overflow: clip !important; font-size: 14px !important; line-height: 1.3; }
  /* Z-chip: plus grand, ne se rétrécit pas */
  .anomaly-row .z-chip { font-size: 13px !important; padding: 5px 11px !important; flex-shrink: 0 !important; margin-top: 2px; }

  /* Modal */
  .modal { width: 96vw; padding: 18px; }
}

/* Stats tab */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
.stats-grid.wide { grid-template-columns: 1fr; }
.stat-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
.stat-panel h3 { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 14px; }
.tier-overview-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.tier-overview-table th { text-align: left; padding: 6px 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: .4px; border-bottom: 1px solid var(--border); }
.tier-overview-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
.tier-overview-table tr:last-child td { border-bottom: none; }
.tier-overview-table tr:hover td { background: var(--surface2); }
.stat-val { font-weight: 700; }
.stat-range { font-size: 10px; color: var(--muted); }
.mini-bar-wrap { display: flex; align-items: center; gap: 6px; }
.mini-bar-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; position: relative; min-width: 60px; }
.mini-bar-fill { position: absolute; top: 0; height: 100%; border-radius: 2px; }
.anomaly-row { display: grid; grid-template-columns: 1fr 60px 90px 100px 1fr 70px; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; font-size: 12px; }
.anomaly-row:hover { background: var(--surface2); }
.anomaly-row:last-child { border-bottom: none; }
.anomaly-header { display: grid; grid-template-columns: 1fr 60px 90px 100px 1fr 70px; gap: 10px; padding: 6px 12px; font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; border-bottom: 2px solid var(--border); }
.severity-bar { height: 6px; border-radius: 3px; }
.z-chip { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; text-align: center; white-space: nowrap; }
.z-mild { background: #2a2a10; color: var(--yellow); }
.z-high { background: #3a1a10; color: var(--red); }
.direction-high { color: var(--red); }
.direction-low { color: #6ab4e8; }
.tier-filter-chips { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.tier-chip { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: none; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 600; }
.tier-chip.active { border-color: currentColor; }
.tier-chip-1.active { color: var(--tier1); background: #1a3a2e; border-color: var(--tier1); }
.tier-chip-2.active { color: var(--tier2); background: #1a2e3a; border-color: var(--tier2); }
.tier-chip-3.active { color: var(--tier3); background: #2e1a3a; border-color: var(--tier3); }
.tier-chip-4.active { color: var(--tier4); background: #3a2a10; border-color: var(--tier4); }
.tier-chip-5.active { color: var(--tier5); background: #3a1010; border-color: var(--tier5); }
.threshold-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 12px; color: var(--muted); }
.threshold-row input[type=range] { accent-color: var(--accent); width: 120px; }
.stat-sparkline { display: flex; gap: 2px; align-items: flex-end; height: 24px; }
.spark-bar { width: 5px; border-radius: 2px 2px 0 0; background: var(--accent); opacity: .6; }
.spark-bar.highlight { opacity: 1; background: var(--accent2); }
.no-anomalies { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }
.broken-link-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; font-size: 12px; }
.broken-link-row:hover { background: var(--surface2); }
.broken-link-row:last-child { border-bottom: none; }

/* DB explorer */
.db-tables-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.db-table-chip { padding: 6px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.db-table-chip:hover { color: var(--text); border-color: var(--accent); }
.db-table-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.db-count { background: rgba(0,0,0,.25); border-radius: 999px; padding: 1px 7px; font-size: 11px; }
.db-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 13px; }
.db-pager { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.db-table-scroll { overflow: auto; max-height: calc(100vh - 220px); border: 1px solid var(--border); border-radius: 8px; }
.db-table { border-collapse: collapse; width: 100%; font-size: 12px; }
.db-table th { position: sticky; top: 0; background: var(--surface2); color: var(--muted); text-align: left; padding: 8px 10px; white-space: nowrap; border-bottom: 1px solid var(--border); z-index: 1; }
.db-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
.db-table tbody tr:hover { background: var(--surface2); }
.db-null { color: var(--muted); font-style: italic; opacity: .6; }
.db-admin-toggle { padding: 4px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 11px; cursor: pointer; white-space: nowrap; }
.db-admin-toggle:hover { border-color: var(--accent); color: var(--text); }
.db-admin-toggle.is-admin { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="/" style="color:var(--muted);text-decoration:none;font-size:20px;line-height:1;padding:4px 8px;border-radius:6px;transition:color .15s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">←</a>
    <h1>Soulforge — Card Manager</h1>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('cards')">Cartes</button>

<!-- TOAST -->
<div class="toast hidden" id="toast"></div>

<script>
// ================== STATE ==================
let cards = [], attributes = [], powers = [], boards = [], magies = [], publicDecks = [];
let selectedCard = null, selectedAttr = null, selectedPower = null, selectedBoard = null, selectedMagie = null, selectedPublicDeck = null;
let currentTab = 'cards';
let isNewCard = false, isNewAttr = false, isNewPower = false, isNewBoard = false, isNewMagie = false, isNewPublicDeck = false;
let selectionMode = false;
const bulkSelected = new Set();

// ================== INIT ==================
async function init() {
  [cards, attributes, powers, boards, magies, publicDecks] = await Promise.all([
    apiFetch('/api/cards'),
    apiFetch('/api/attributes'),
    apiFetch('/api/powers'),
    apiFetch('/api/boards'),
    apiFetch('/api/magies'),
    apiFetch('/api/decks'),
  ]);
  populateAttributeFilter();
  populatePowerFilter();
  renderCardList();
  renderAttrList();
  renderPowerList();
  renderBoardList();
  renderMagieList();
  renderPublicDeckList();
}

function populateAttributeFilter() {
  const sel = document.getElementById('filter-attribute');
  if (!sel) return;
  const sorted = [...attributes].sort((a, b) => a.name.localeCompare(b.name));
  sel.innerHTML = '<option value="">Tous attributs</option>' +
    sorted.map(a => `<option value="${a.id}">${a.icon ? a.icon + ' ' : ''}${a.name}</option>`).join('');
}

function populatePowerFilter() {
  const sel = document.getElementById('filter-power');
  if (!sel) return;
  const sorted = [...powers].sort((a, b) => a.name.localeCompare(b.name));
  sel.innerHTML = '<option value="">Tous pouvoirs</option><option value="none">Aucun pouvoir</option>' +
    sorted.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
}

// ================== API ==================
async function apiFetch(url, options = {}) {
  const r = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  return r.json();
}

// ================== TABS ==================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.main').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(el => {
    const t = el.textContent.toLowerCase();
    const match = (tab === 'cards' && t.includes('carte')) ||
                  (tab === 'attributes' && t.includes('attribut')) ||
                  (tab === 'powers' && t.includes('pouv')) ||
                  (tab === 'boards' && t.includes('terrain')) ||
                  (tab === 'magies' && t.includes('magie')) ||
                  (tab === 'decks' && t.includes('deck')) ||
                  (tab === 'stats' && t.includes('stat')) ||
                  (tab === 'db' && t.includes('sql'));
    if (match) el.classList.add('active');
  });
  if (tab === 'stats') renderStats();
  if (tab === 'db') renderDbTables();
  showList(); // reset panel on tab switch
}

// ================== DB EXPLORER (read-only) ==================
let dbCurrentTable = null;
let dbOffset = 0;
const DB_PAGE = 50;

async function renderDbTables() {
  const el = document.getElementById('db-content');
  el.innerHTML = '<div class="empty"><span>Chargement...</span></div>';
  let data;
  try { data = await apiFetch('/api/admin/db/tables'); }
  catch (e) { el.innerHTML = `<div class="empty"><span>Erreur : ${esc(e.message)}</span></div>`; return; }
  if (data.error) { el.innerHTML = `<div class="empty"><span>Erreur : ${esc(data.error)}</span></div>`; return; }
  const chips = data.tables.map(t =>
    `<button class="db-table-chip${t.name === dbCurrentTable ? ' active' : ''}" data-table="${esc(t.name)}" onclick="openDbTable('${esc(t.name)}', 0)">
       ${esc(t.name)} <span class="db-count">${t.count}</span>
     </button>`).join('');
  el.innerHTML = `
    <div class="db-tables-bar">${chips || '<span style="color:var(--muted)">Aucune table</span>'}</div>
    <div id="db-table-view"><div class="empty"><span>Choisis une table ci-dessus.</span></div></div>`;
  if (dbCurrentTable && data.tables.some(t => t.name === dbCurrentTable)) openDbTable(dbCurrentTable, dbOffset);
}

async function openDbTable(name, offset) {
  dbCurrentTable = name; dbOffset = offset;
  document.querySelectorAll('.db-table-chip').forEach(c => c.classList.toggle('active', c.dataset.table === name));
  const view = document.getElementById('db-table-view');
  if (view) view.innerHTML = '<div class="empty"><span>Chargement...</span></div>';
  let data;
  try { data = await apiFetch(`/api/admin/db/table/${encodeURIComponent(name)}?limit=${DB_PAGE}&offset=${offset}`); }
  catch (e) { if (view) view.innerHTML = `<div class="empty"><span>Erreur : ${esc(e.message)}</span></div>`; return; }
  if (data.error) { if (view) view.innerHTML = `<div class="empty"><span>Erreur : ${esc(data.error)}</span></div>`; return; }

  const isUsers = name === 'users' && data.columns.includes('is_admin') && data.columns.includes('id');
  const head = data.columns.map(c => `<th>${esc(c)}</th>`).join('') + (isUsers ? '<th>Admin</th>' : '');
  const colCount = data.columns.length + (isUsers ? 1 : 0);
  const body = data.rows.length
    ? data.rows.map(r => {
        const cells = data.columns.map(c => `<td>${r[c] === null ? '<span class="db-null">NULL</span>' : esc(r[c])}</td>`).join('');
        if (!isUsers) return `<tr>${cells}</tr>`;
        const isAdminNow = r.is_admin === '1';
        const actionCell = `<td>
          <button class="db-admin-toggle${isAdminNow ? ' is-admin' : ''}"
            onclick="toggleUserAdmin('${esc(r.id)}', ${!isAdminNow})">
            ${isAdminNow ? '✓ Admin' : 'Promouvoir'}
          </button>
        </td>`;
        return `<tr>${cells}${actionCell}</tr>`;
      }).join('')
    : `<tr><td colspan="${colCount || 1}" style="text-align:center;color:var(--muted);padding:16px">Aucune ligne</td></tr>`;

  const from = data.total ? offset + 1 : 0;
  const to = Math.min(offset + DB_PAGE, data.total);
  const prevDis = offset <= 0 ? 'disabled' : '';
  const nextDis = offset + DB_PAGE >= data.total ? 'disabled' : '';
  document.getElementById('db-table-view').innerHTML = `
    <div class="db-toolbar">
      <strong>${esc(name)}</strong>
      <span style="color:var(--muted)">${data.total} ligne(s)</span>
      <div class="db-pager">
        <button class="tab" ${prevDis} onclick="openDbTable('${esc(name)}', ${Math.max(0, offset - DB_PAGE)})">‹</button>
        <span>${from}–${to}</span>
        <button class="tab" ${nextDis} onclick="openDbTable('${esc(name)}', ${offset + DB_PAGE})">›</button>
      </div>
    </div>
    <div class="db-table-scroll">
      <table class="db-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
    </div>`;
}

async function toggleUserAdmin(userId, nextIsAdmin) {
  try {
    const res = await fetch(`/api/admin/db/users/${encodeURIComponent(userId)}/admin`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ is_admin: nextIsAdmin }),
    });
    const data = await res.json();
    if (!res.ok || data.error) { toast(data.error || 'Erreur', 'err'); return; }
    toast(nextIsAdmin ? 'Promu administrateur.' : 'Droits admin retirés.');
    openDbTable('users', dbOffset);
  } catch (e) { toast(e.message, 'err'); }
}

// ================== CARDS ==================
function tierBadge(tier) {
  return `<span class="badge badge-tier${Math.round(tier)}">T${Math.round(tier)}</span>`;
}
function summonLabel(t) {
  return { normal: 'Normal', sacrifice: 'Sacrifice', fusion: 'Fusion', heritage: 'Heritage', transformation: 'Transfo' }[t] || t;
}
function summonColor(t) {
  return { normal: '#78c8a8', sacrifice: '#f0a040', fusion: '#c878e0', heritage: '#6ab4e8', transformation: '#ff8040' }[t] || '#888';
}

function filterCards() {
  const q = document.getElementById('card-search').value.toLowerCase();
  const tier = document.getElementById('filter-tier').value;
  const summon = document.getElementById('filter-summon').value;
  const illus = document.getElementById('filter-illus').value;
  const attribute = document.getElementById('filter-attribute').value;
  const power = document.getElementById('filter-power').value;
  const filtered = cards.filter(c =>
    (!q || c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q)) &&
    (!tier || Math.round(c.tier) == tier) &&
    (!summon || c.summon_type === summon) &&
    (!illus || (illus === 'yes' ? c._has_illustration : !c._has_illustration)) &&
    (!attribute || (c.attributes || []).includes(attribute)) &&
    (!power || (power === 'none' ? !(c.power && c.power.id) : (c.power && c.power.id === power)))
  );
  renderCardList(filtered);
}

function renderCardList(list = cards) {
  const el = document.getElementById('card-list');
  document.getElementById('card-count').textContent = list.length;
  el.innerHTML = list.map(c => {
    const isBulk = bulkSelected.has(c.id);
    const isActive = !selectionMode && selectedCard && selectedCard.id === c.id;
    const thumb = c._has_illustration
      ? `<img class="list-thumb" src="/illustrations/${c.id}" alt="" loading="lazy">`
      : `<div class="list-thumb-placeholder"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" opacity=".3"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>`;
    const check = `<div class="bulk-check ${isBulk ? 'checked' : ''}">${isBulk ? `<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5 L4 7 L8 3" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ''}</div>`;
    return `
      <div class="list-item ${isActive ? 'selected' : ''} ${isBulk ? 'bulk-selected' : ''}" data-id="${c.id}"
           onclick="${selectionMode ? `toggleCardSelection('${c.id}')` : `selectCard('${c.id}')`}">
        ${selectionMode ? check : thumb}
        <div style="flex:1;min-width:0">
          <span class="item-name" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</span>
          <div style="display:flex;gap:4px;margin-top:3px">
            ${tierBadge(c.tier)}
            <span class="badge" style="background:var(--surface2);color:${summonColor(c.summon_type)};font-size:10px">${summonLabel(c.summon_type)}</span>
            ${(c.summon_options && c.summon_options.length) ? `<span class="badge" style="background:var(--surface2);color:#e07be0;font-size:10px">🔀 ${c.summon_options.length}</span>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

function selectCard(id) {
  selectedCard = cards.find(c => c.id === id);
  isNewCard = false;
  filterCards();
  renderCardDetail();
  showDetail();
}

function getAttrName(id) {
  const a = attributes.find(x => x.id === id);
  return a ? `${a.icon || ''} ${a.name}` : id;
}
function getPowerName(id) {
  const p = powers.find(x => x.id === id);
  return p ? p.name : id;
}
function getCardName(id) {
  const c = cards.find(x => x.id === id);
  return c ? c.name : id;
}
function getMaterialName(id) {
  const c = cards.find(x => x.id === id);
  if (c) return c.name;
  const a = attributes.find(x => x.id === id);
  if (a) return (a.icon ? a.icon + ' ' : '') + a.name;
  return id;
}
function isMaterialAttribute(id) {
  return !cards.find(x => x.id === id) && !!attributes.find(x => x.id === id);
}

function renderCardDetail() {
  const c = selectedCard;
  if (!c) return;
  const el = document.getElementById('card-detail');
  const hasIllus = c._has_illustration;
  const hasPower = c.power && c.power.id;

  let idFieldHtml;
  if (isNewCard) {
    const allSets = getSets();
    const lastSet = localStorage.getItem('lastSet') || '';
    const curSet = allSets.includes(lastSet) ? lastSet : allSets[0];
    const nextN = getNextNumForSet(curSet);
    const initId = `${curSet}_${String(nextN).padStart(3, '0')}`;
    selectedCard.id = initId;
    const setOpts = allSets.map(s => `<option value="${s}" ${s === curSet ? 'selected' : ''}>${s}</option>`).join('');
    idFieldHtml = `
      <div class="set-picker-row">
        <select id="f-set" onchange="onSetChange()" style="flex:1;min-width:90px">${setOpts}<option value="__new__">+ Nouveau set…</option></select>
        <div id="f-set-new-wrap" style="display:none;flex:1"><input id="f-set-new" placeholder="NOM_DU_SET" oninput="syncIdFromSet()" style="width:100%;font-family:monospace;text-transform:uppercase"></div>
        <span class="set-sep">_</span>
        <input type="number" id="f-num" min="1" value="${nextN}" oninput="syncIdFromSet()" class="set-num">
      </div>
      <input id="f-id" value="${initId}" class="set-result-id" placeholder="CORE_001">`;
  } else {
    idFieldHtml = `<input id="f-id" value="${esc(c.id)}" placeholder="CORE_001">`;
  }

  el.innerHTML = `
    <button class="back-btn" onclick="showList()">Retour à la liste</button>
    <div class="detail-header">
      <div class="illustration-box" id="illus-box">
        ${hasIllus ? `<img src="/illustrations/${c.id}" id="illus-img" alt="">` : `<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" opacity=".3"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>`}
        <div class="illus-overlay">
          ${hasIllus ? `<button class="btn btn-danger btn-sm" onclick="deleteIllustration()">Supprimer</button>` : ''}
          <button class="btn btn-secondary btn-sm" onclick="openIllusModal()">Importer URL</button>
        </div>
      </div>
      <div class="detail-info">
        <div class="detail-title">${c.name}</div>
        <div class="detail-meta">
          ${tierBadge(c.tier)}
          <span class="badge badge-summon">${summonLabel(c.summon_type)}</span>
          ${(c.summon_options && c.summon_options.length) ? `<span class="badge" style="background:#e07be022;color:#e07be0">🔀 ${c.summon_options.length} options alt.</span>` : ''}
          ${hasPower ? `<span class="badge badge-power">⚡ ${getPowerName(c.power.id)}</span>` : ''}
          <span class="badge ${hasIllus ? 'badge-illus' : 'badge-no-illus'}">${hasIllus ? '🖼 Illus.' : 'Pas d\'illus.'}</span>
        </div>
        <div id="detail-card-id-display" style="font-family:monospace;font-size:11px;color:var(--muted)">${c.id}</div>
      </div>
    </div>

    <div class="section-title">Identité</div>
    <div class="form-grid">
      <div class="field"><label>ID</label>${idFieldHtml}</div>
      <div class="field"><label>Nom</label><input id="f-name" value="${esc(c.name)}" placeholder="Nom de la carte"></div>
      <div class="field">
        <label>Tier <span class="slider-val" id="f-tier-val">${Math.round(c.tier)}</span></label>
        <input type="range" id="f-tier" min="1" max="5" step="1" value="${Math.round(c.tier)}" oninput="document.getElementById('f-tier-val').textContent=this.value">
        <div class="slider-marks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
      </div>
      <div class="field"><label>Type d'invocation</label>
        <select id="f-summon" onchange="onSummonTypeChange(this.value)">
          ${['normal','sacrifice','fusion','heritage','transformation'].map(s => `<option value="${s}" ${c.summon_type===s?'selected':''}>${summonLabel(s)}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="section-title">Stats</div>
    <div class="stats-grid">
      <div class="field"><label>ATK</label><input type="number" id="f-atk" value="${c.stats.atk}" step="0.5"></div>
      <div class="field"><label>HP</label><input type="number" id="f-hp" value="${c.stats.hp}" step="0.5"></div>
      <div class="field">
        <label>Portée <span class="slider-val" id="f-range-val">${Math.min(4,Math.max(1,Math.round(c.stats.range)))}</span></label>
        <input type="range" id="f-range" min="1" max="4" step="1" value="${Math.min(4,Math.max(1,Math.round(c.stats.range)))}" oninput="document.getElementById('f-range-val').textContent=this.value">
        <div class="slider-marks"><span>1</span><span>2</span><span>3</span><span>4</span></div>
      </div>
      <div class="field">
        <label>Vit. déplacement <span class="slider-val" id="f-move-val">${Math.min(20,Math.max(5,Math.round(c.stats.movement_speed/5)*5))}</span></label>
        <input type="range" id="f-move" min="5" max="20" step="5" value="${Math.min(20,Math.max(5,Math.round(c.stats.movement_speed/5)*5))}" oninput="document.getElementById('f-move-val').textContent=this.value">
        <div class="slider-marks"><span>5</span><span>10</span><span>15</span><span>20</span></div>
      </div>
      <div class="field">
        <label>Vit. attaque <span class="slider-val" id="f-aspeed-val">${Math.min(20,Math.max(1,Math.round(c.stats.attack_speed)))}</span></label>
        <input type="range" id="f-aspeed" min="1" max="20" step="1" value="${Math.min(20,Math.max(1,Math.round(c.stats.attack_speed)))}" oninput="document.getElementById('f-aspeed-val').textContent=this.value">
        <div class="slider-marks"><span>1</span><span>20</span></div>
      </div>
      <div class="field">
        <label>Initiative <span class="slider-val" id="f-init-val">${Math.min(10,Math.max(1,Math.round(c.stats.initiative)))}</span></label>
        <input type="range" id="f-init" min="1" max="10" step="1" value="${Math.min(10,Math.max(1,Math.round(c.stats.initiative)))}" oninput="document.getElementById('f-init-val').textContent=this.value">
        <div class="slider-marks"><span>1</span><span>10</span></div>
      </div>
    </div>

    <div class="section-title">Pouvoir</div>
    <div class="form-grid">
      <div class="field"><label>Pouvoir</label>
        <select id="f-power-id" onchange="togglePowerFields()">
          <option value="">Aucun</option>
          ${powers.map(p => `<option value="${p.id}" ${hasPower && c.power.id===p.id?'selected':''}>${p.name}</option>`).join('')}
        </select>
      </div>
      <div class="field" id="f-power-speed-wrap"><label>Vitesse pouvoir</label><input type="number" id="f-power-speed" value="${hasPower && c.power.power_speed != null ? c.power.power_speed : ''}" step="0.5" placeholder="ex: 60"></div>
      <div class="field" id="f-power-val-wrap"><label>Valeur</label><input type="number" id="f-power-val" value="${hasPower && c.power.value != null ? c.power.value : ''}" step="0.5" placeholder="optionnel"></div>
    </div>

    <div class="section-title">Coût d'invocation</div>
    <div class="form-grid">
      <div class="field">
        <label>Sacrifices requis <span class="slider-val" id="f-sac-val">${Math.min(3,Math.max(0,c.cost.sacrifice||0))}</span></label>
        <input type="range" id="f-sac" min="0" max="3" step="1" value="${Math.min(3,Math.max(0,c.cost.sacrifice||0))}" oninput="document.getElementById('f-sac-val').textContent=this.value">
        <div class="slider-marks"><span>0</span><span>1</span><span>2</span><span>3</span></div>
      </div>
    </div>
    <div id="materials-section">
      <div id="material-section-label" style="font-size:11px;color:var(--muted);margin-top:10px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:600">${c.summon_type === 'heritage' ? 'Matériaux de Heritage' : 'Matériaux de fusion/heritage'}</div>
      <div class="materials-list" id="materials-list">
        ${(c.cost.materials || []).map(mid => {
          const isAttr = !cards.find(x => x.id === mid) && !!attributes.find(x => x.id === mid);
          return `
          <div class="material-item" data-mid="${mid}">
            <span style="display:flex;align-items:center;gap:6px">
              ${isAttr ? `<span style="font-size:10px;background:#6ab4e822;color:#6ab4e8;border-radius:4px;padding:1px 5px;white-space:nowrap">Attribut</span>` : ''}
              <span>${esc(getMaterialName(mid))}</span>
              <span style="font-size:10px;color:var(--muted);font-family:monospace">${mid}</span>
            </span>
            <button onclick="removeMaterial('${mid}')">×</button>
          </div>`;
        }).join('')}
      </div>
      <div style="position:relative;margin-top:8px" id="material-search-wrap">
        <input type="text" id="material-search" placeholder="${c.summon_type === 'heritage' ? 'Rechercher une carte ou un attribut...' : 'Rechercher une carte à ajouter...'}" autocomplete="off"
          oninput="filterMaterialSearch()" onfocus="showMaterialDropdown()" onblur="hideMaterialDropdown()"
          style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;outline:none;font-size:13px">
        <div id="material-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:6px;max-height:220px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.4);margin-top:3px"></div>
      </div>
    </div>

    <div class="section-title">Lignée (cartes représentées)</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">
      IDs de cartes que cette carte « représente » en plus d'elle-même pour le matching de matériaux fusion/heritage/transformation (ex : une fusion Avian+Burstinatrix doit lister Avian et Burstinatrix ici pour pouvoir combler leurs slots dans une fusion ultérieure qui les requiert).
    </div>
    <div class="materials-list" id="represented-list">
      ${(c.represented_ids || []).map(rid => `
        <div class="material-item" data-mid="${rid}">
          <span style="display:flex;align-items:center;gap:6px">
            <span>${esc(getMaterialName(rid))}</span>
            <span style="font-size:10px;color:var(--muted);font-family:monospace">${rid}</span>
          </span>
          <button onclick="removeRepresented('${rid}')">×</button>
        </div>`).join('')}
    </div>
    <div style="position:relative;margin-top:8px;margin-bottom:20px" id="represented-search-wrap">
      <input type="text" id="represented-search" placeholder="Rechercher une carte à ajouter à la lignée..." autocomplete="off"
        oninput="filterRepresentedSearch()" onfocus="showRepresentedDropdown()" onblur="hideRepresentedDropdown()"
        style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;outline:none;font-size:13px">
      <div id="represented-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:6px;max-height:220px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.4);margin-top:3px"></div>
    </div>

    <div class="section-title">Options d'invocation alternatives</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">
      Permet d'invoquer le même monstre par plusieurs méthodes différentes (ex : transformation depuis une carte précise OU sacrifice de plusieurs monstres). ${(c.summon_options && c.summon_options.length) ? `<strong style="color:var(--text)">Le type et le coût classiques ci-dessus sont ignorés</strong> tant qu'au moins une option est définie ici.` : `Tant qu'aucune option n'est ajoutée, le type et le coût classiques ci-dessus s'appliquent normalement.`}
    </div>
    <div id="summon-options-list">
      ${(c.summon_options || []).map((opt, idx) => optionRowHtml(opt, idx)).join('')}
    </div>
    <button class="btn btn-secondary btn-sm" onclick="addSummonOption()" style="margin-bottom:20px">+ Ajouter une option alternative</button>

    <div class="section-title">Attributs</div>
    <div class="attr-chips" id="attr-chips">
      ${(c.attributes || []).map(aid => `
        <span class="attr-chip" onclick="removeCardAttribute('${aid}')">
          ${getAttrName(aid)} <span class="remove">×</span>
        </span>
      `).join('')}
      <button class="attr-add" onclick="openAttrPickModal()">+ Ajouter</button>
    </div>

    <div class="actions">
      ${isNewCard
        ? `<button class="btn btn-success" onclick="createCard()">Créer la carte</button>
           <button class="btn btn-secondary" onclick="cancelNew()">Annuler</button>`
        : `<button class="btn btn-primary" onclick="saveCard()">Enregistrer</button>
           <button class="btn btn-secondary" onclick="duplicateCard()" title="Crée une copie avec un nouvel ID">⧉ Dupliquer</button>
           <button class="btn btn-danger" onclick="deleteCard()">Supprimer</button>`}
    </div>
  `;
  togglePowerFields();
}

function togglePowerFields() {
  const hasPower = document.getElementById('f-power-id')?.value;
  const speedWrap = document.getElementById('f-power-speed-wrap');
  const valWrap = document.getElementById('f-power-val-wrap');
  if (speedWrap) speedWrap.style.display = hasPower ? '' : 'none';
  if (valWrap) valWrap.style.display = hasPower ? '' : 'none';
}

function removeCardAttribute(aid) {
  syncCardFromForm();
  selectedCard.attributes = (selectedCard.attributes || []).filter(a => a !== aid);
  renderCardDetail();
}

function removeMaterial(mid) {
  syncCardFromForm();
  selectedCard.cost.materials = (selectedCard.cost.materials || []).filter(m => m !== mid);
  renderCardDetail();
}

function removeRepresented(rid) {
  syncCardFromForm();
  selectedCard.represented_ids = (selectedCard.represented_ids || []).filter(r => r !== rid);
  renderCardDetail();
}

function addRepresented(id) {
  syncCardFromForm();
  if (!selectedCard.represented_ids) selectedCard.represented_ids = [];
  if (!selectedCard.represented_ids.includes(id) && id !== selectedCard.id) {
    selectedCard.represented_ids.push(id);
    renderCardDetail();
  }
}

function filterRepresentedSearch() {
  const q = document.getElementById('represented-search')?.value.toLowerCase() || '';
  const current = selectedCard.represented_ids || [];

  const results = cards
    .filter(x => x.id !== selectedCard.id && !current.includes(x.id))
    .filter(x => !q || x.name.toLowerCase().includes(q) || x.id.toLowerCase().includes(q))
    .slice(0, 20);

  renderRepresentedDropdown(results);
}

function renderRepresentedDropdown(results) {
  const dd = document.getElementById('represented-dropdown');
  if (!dd) return;
  if (!results.length) {
    dd.innerHTML = '<div style="padding:10px 14px;color:var(--muted);font-size:12px">Aucun résultat</div>';
  } else {
    dd.innerHTML = results.map(x => `
        <div onmousedown="addRepresented('${x.id}')"
          style="padding:8px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border)"
          onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''">
          <div>
            <div style="font-size:13px">${esc(x.name)}</div>
            <div style="margin-top:2px"><span style="font-size:11px;color:var(--muted);font-family:monospace">${x.id} · T${Math.round(x.tier)} · ${summonLabel(x.summon_type)}</span></div>
          </div>
        </div>`).join('');
  }
  dd.style.display = 'block';
}

function showRepresentedDropdown() {
  filterRepresentedSearch();
}

function hideRepresentedDropdown() {
  setTimeout(() => {
    const dd = document.getElementById('represented-dropdown');
    if (dd) dd.style.display = 'none';
  }, 150);
}

function filterMaterialSearch() {
  const q = document.getElementById('material-search')?.value.toLowerCase() || '';
  const summon = document.getElementById('f-summon')?.value;
  const current = selectedCard.cost?.materials || [];

  const matchedCards = cards
    .filter(x => x.id !== selectedCard.id && !current.includes(x.id))
    .filter(x => !q || x.name.toLowerCase().includes(q) || x.id.toLowerCase().includes(q))
    .slice(0, 20)
    .map(x => ({ ...x, _matType: 'card' }));

  let results = matchedCards;

  if (summon === 'heritage') {
    const matchedAttrs = attributes
      .filter(a => !current.includes(a.id))
      .filter(a => !q || a.name.toLowerCase().includes(q) || a.id.toLowerCase().includes(q))
      .slice(0, 10)
      .map(a => ({ ...a, _matType: 'attribute' }));
    results = [...matchedAttrs, ...matchedCards];
  }

  renderMaterialDropdown(results);
}

function renderMaterialDropdown(results) {
  const dd = document.getElementById('material-dropdown');
  if (!dd) return;
  if (!results.length) {
    dd.innerHTML = '<div style="padding:10px 14px;color:var(--muted);font-size:12px">Aucun résultat</div>';
  } else {
    dd.innerHTML = results.map(x => {
      const isAttr = x._matType === 'attribute';
      const sub = isAttr
        ? `<span style="font-size:10px;background:#6ab4e822;color:#6ab4e8;border-radius:4px;padding:1px 5px">Attribut</span>`
        : `<span style="font-size:11px;color:var(--muted);font-family:monospace">${x.id} · T${Math.round(x.tier)} · ${summonLabel(x.summon_type)}</span>`;
      return `
        <div onmousedown="addMaterial('${x.id}')"
          style="padding:8px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border)"
          onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''">
          ${isAttr ? `<span style="font-size:16px">${x.icon || '🔷'}</span>` : ''}
          <div>
            <div style="font-size:13px">${esc(x.name)}</div>
            <div style="margin-top:2px">${sub}</div>
          </div>
        </div>`;
    }).join('');
  }
  dd.style.display = 'block';
}

function optionMaterialsLabel(type) {
  return type === 'heritage' ? 'Matériaux de Heritage' : 'Matériaux de fusion/heritage/transformation';
}

function optionRowHtml(opt, idx) {
  const sac = Math.min(3, Math.max(0, opt.cost?.sacrifice || 0));
  const mats = opt.cost?.materials || [];
  return `
    <div class="option-row" data-idx="${idx}" style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--surface2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:600;font-size:12px;color:var(--muted)">Option ${idx + 1}</span>
        <button class="btn btn-danger btn-sm" onclick="removeSummonOption(${idx})">× Retirer</button>
      </div>
      <div class="form-grid">
        <div class="field"><label>Type d'invocation</label>
          <select id="opt-summon-${idx}" onchange="onOptionSummonTypeChange(${idx}, this.value)">
            ${['normal', 'sacrifice', 'fusion', 'heritage', 'transformation'].map(s => `<option value="${s}" ${opt.summon_type === s ? 'selected' : ''}>${summonLabel(s)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Sacrifices requis <span class="slider-val" id="opt-sac-val-${idx}">${sac}</span></label>
          <input type="range" id="opt-sac-${idx}" min="0" max="3" step="1" value="${sac}" oninput="document.getElementById('opt-sac-val-${idx}').textContent=this.value">
          <div class="slider-marks"><span>0</span><span>1</span><span>2</span><span>3</span></div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:10px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:600" id="opt-material-label-${idx}">${optionMaterialsLabel(opt.summon_type)}</div>
      <div class="materials-list" id="opt-materials-list-${idx}">
        ${mats.map(mid => {
          const isAttr = isMaterialAttribute(mid);
          return `
          <div class="material-item" data-mid="${mid}">
            <span style="display:flex;align-items:center;gap:6px">
              ${isAttr ? `<span style="font-size:10px;background:#6ab4e822;color:#6ab4e8;border-radius:4px;padding:1px 5px;white-space:nowrap">Attribut</span>` : ''}
              <span>${esc(getMaterialName(mid))}</span>
              <span style="font-size:10px;color:var(--muted);font-family:monospace">${mid}</span>
            </span>
            <button onclick="removeOptionMaterial(${idx}, '${mid}')">×</button>
          </div>`;
        }).join('')}
      </div>
      <div style="position:relative;margin-top:8px" id="opt-material-search-wrap-${idx}">
        <input type="text" id="opt-material-search-${idx}" placeholder="Rechercher une carte ou un attribut..." autocomplete="off"
          oninput="filterOptionMaterialSearch(${idx})" onfocus="showOptionMaterialDropdown(${idx})" onblur="hideOptionMaterialDropdown(${idx})"
          style="width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;outline:none;font-size:13px">
        <div id="opt-material-dropdown-${idx}" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:6px;max-height:220px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.4);margin-top:3px"></div>
      </div>
    </div>`;
}

function addSummonOption() {
  syncCardFromForm();
  if (!selectedCard.summon_options) selectedCard.summon_options = [];
  selectedCard.summon_options.push({ summon_type: 'normal', cost: { sacrifice: 0, materials: [] } });
  renderCardDetail();
}

function removeSummonOption(idx) {
  syncCardFromForm();
  selectedCard.summon_options.splice(idx, 1);
  renderCardDetail();
}

function onOptionSummonTypeChange(idx, val) {
  syncCardFromForm();
  selectedCard.summon_options[idx].summon_type = val;
  renderCardDetail();
}

function removeOptionMaterial(idx, mid) {
  syncCardFromForm();
  const opt = selectedCard.summon_options[idx];
  opt.cost.materials = (opt.cost.materials || []).filter(m => m !== mid);
  renderCardDetail();
}

function addOptionMaterial(idx, id) {
  syncCardFromForm();
  const opt = selectedCard.summon_options[idx];
  if (!opt.cost.materials) opt.cost.materials = [];
  if (!opt.cost.materials.includes(id)) {
    opt.cost.materials.push(id);
    renderCardDetail();
  }
}

function filterOptionMaterialSearch(idx) {
  const q = document.getElementById(`opt-material-search-${idx}`)?.value.toLowerCase() || '';
  const summonType = document.getElementById(`opt-summon-${idx}`)?.value;
  const current = selectedCard.summon_options[idx]?.cost?.materials || [];

  const matchedCards = cards
    .filter(x => x.id !== selectedCard.id && !current.includes(x.id))
    .filter(x => !q || x.name.toLowerCase().includes(q) || x.id.toLowerCase().includes(q))
    .slice(0, 20)
    .map(x => ({ ...x, _matType: 'card' }));

  let results = matchedCards;
  if (summonType === 'heritage') {
    const matchedAttrs = attributes
      .filter(a => !current.includes(a.id))
      .filter(a => !q || a.name.toLowerCase().includes(q) || a.id.toLowerCase().includes(q))
      .slice(0, 10)
      .map(a => ({ ...a, _matType: 'attribute' }));
    results = [...matchedAttrs, ...matchedCards];
  }

  renderOptionMaterialDropdown(idx, results);
}

function renderOptionMaterialDropdown(idx, results) {
  const dd = document.getElementById(`opt-material-dropdown-${idx}`);
  if (!dd) return;
  if (!results.length) {
    dd.innerHTML = '<div style="padding:10px 14px;color:var(--muted);font-size:12px">Aucun résultat</div>';
  } else {
    dd.innerHTML = results.map(x => {
      const isAttr = x._matType === 'attribute';
      const sub = isAttr
        ? `<span style="font-size:10px;background:#6ab4e822;color:#6ab4e8;border-radius:4px;padding:1px 5px">Attribut</span>`
        : `<span style="font-size:11px;color:var(--muted);font-family:monospace">${x.id} · T${Math.round(x.tier)} · ${summonLabel(x.summon_type)}</span>`;
      return `
        <div onmousedown="addOptionMaterial(${idx}, '${x.id}')"
          style="padding:8px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border)"
          onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''">
          ${isAttr ? `<span style="font-size:16px">${x.icon || '🔷'}</span>` : ''}
          <div>
            <div style="font-size:13px">${esc(x.name)}</div>
            <div style="margin-top:2px">${sub}</div>
          </div>
        </div>`;
    }).join('');
  }
  dd.style.display = 'block';
}

function showOptionMaterialDropdown(idx) {
  filterOptionMaterialSearch(idx);
}

function hideOptionMaterialDropdown(idx) {
  // Delay so onmousedown on items fires first
  setTimeout(() => {
    const dd = document.getElementById(`opt-material-dropdown-${idx}`);
    if (dd) dd.style.display = 'none';
  }, 150);
}

function collectSummonOptionsFromForm() {
  if (!selectedCard.summon_options || !selectedCard.summon_options.length) return undefined;
  return selectedCard.summon_options.map((opt, idx) => {
    const typeEl = document.getElementById(`opt-summon-${idx}`);
    const sacEl = document.getElementById(`opt-sac-${idx}`);
    return {
      summon_type: typeEl ? typeEl.value : opt.summon_type,
      cost: {
        sacrifice: sacEl ? (parseFloat(sacEl.value) || 0) : (opt.cost?.sacrifice || 0),
        materials: [...(opt.cost?.materials || [])],
      },
    };
  });
}

function onSummonTypeChange(val) {
  syncCardFromForm();
  const label = document.getElementById('material-section-label');
  const input = document.getElementById('material-search');
  if (label) label.textContent = val === 'heritage' ? 'Matériaux de Heritage' : 'Matériaux de fusion/heritage';
  if (input) input.placeholder = val === 'heritage' ? 'Rechercher une carte ou un attribut...' : 'Rechercher une carte à ajouter...';
  filterMaterialSearch();
}

function showMaterialDropdown() {
  filterMaterialSearch();
}

function hideMaterialDropdown() {
  // Delay so onmousedown on items fires first
  setTimeout(() => {
    const dd = document.getElementById('material-dropdown');
    if (dd) dd.style.display = 'none';
  }, 150);
}

function addMaterial(id) {
  syncCardFromForm();
  if (!selectedCard.cost.materials) selectedCard.cost.materials = [];
  if (!selectedCard.cost.materials.includes(id)) {
    selectedCard.cost.materials.push(id);
    renderCardDetail();
  }
}

function syncCardFromForm() {
  if (!selectedCard || !document.getElementById('f-id')) return;
  const powId = document.getElementById('f-power-id')?.value;
  const powSpeed = document.getElementById('f-power-speed')?.value;
  const powVal = document.getElementById('f-power-val')?.value;
  selectedCard.id = document.getElementById('f-id').value.trim();
  selectedCard.name = document.getElementById('f-name').value.trim();
  selectedCard.type = 'monster';
  selectedCard.tier = parseFloat(document.getElementById('f-tier').value);
  selectedCard.summon_type = document.getElementById('f-summon').value;
  selectedCard.stats = {
    atk: parseFloat(document.getElementById('f-atk').value) || 0,
    hp: parseFloat(document.getElementById('f-hp').value) || 0,
    movement_speed: parseFloat(document.getElementById('f-move').value) || 0,
    attack_speed: parseFloat(document.getElementById('f-aspeed').value) || 0,
    initiative: parseFloat(document.getElementById('f-init').value) || 0,
    range: parseFloat(document.getElementById('f-range').value) || 0,
  };
  selectedCard.power = powId
    ? { id: powId, ...(powSpeed !== '' ? { power_speed: parseFloat(powSpeed) } : {}), ...(powVal !== '' ? { value: parseFloat(powVal) } : {}) }
    : {};
  selectedCard.cost = {
    sacrifice: parseFloat(document.getElementById('f-sac').value) || 0,
    materials: selectedCard.cost?.materials || [],
  };
  selectedCard.represented_ids = selectedCard.represented_ids || [];
  selectedCard.summon_options = collectSummonOptionsFromForm();
}

function collectCardFromForm() {
  const powId = document.getElementById('f-power-id').value;
  const powSpeed = document.getElementById('f-power-speed')?.value;
  const powVal = document.getElementById('f-power-val')?.value;
  const power = powId
    ? { id: powId, ...(powSpeed !== '' ? { power_speed: parseFloat(powSpeed) } : {}), ...(powVal !== '' ? { value: parseFloat(powVal) } : {}) }
    : {};

  return {
    id: document.getElementById('f-id').value.trim(),
    name: document.getElementById('f-name').value.trim(),
    type: 'monster',
    tier: parseFloat(document.getElementById('f-tier').value),
    summon_type: document.getElementById('f-summon').value,
    attributes: [...(selectedCard.attributes || [])],
    stats: {
      atk: parseFloat(document.getElementById('f-atk').value),
      hp: parseFloat(document.getElementById('f-hp').value),
      movement_speed: parseFloat(document.getElementById('f-move').value),
      attack_speed: parseFloat(document.getElementById('f-aspeed').value),
      initiative: parseFloat(document.getElementById('f-init').value),
      range: parseFloat(document.getElementById('f-range').value),
    },
    power,
    cost: {
      sacrifice: parseFloat(document.getElementById('f-sac').value),
      materials: [...(selectedCard.cost.materials || [])],
    },
    represented_ids: [...(selectedCard.represented_ids || [])],
    summon_options: collectSummonOptionsFromForm(),
  };
}

async function saveCard() {
  const updated = collectCardFromForm();
  const oldId = selectedCard.id;
  if (!updated.id || !updated.name) return toast('ID et nom requis', 'err');

  const res = await apiFetch(`/api/cards/${oldId}`, { method: 'PUT', body: updated });
  if (res.error) return toast(res.error, 'err');

  const idx = cards.findIndex(c => c.id === oldId);
  updated._has_illustration = cards[idx]._has_illustration;
  cards[idx] = updated;
  selectedCard = updated;
  filterCards();
  renderCardDetail();
  toast('Carte enregistrée');
}

async function deleteCard() {
  if (!confirm(`Supprimer "${selectedCard.name}" ?`)) return;
  const res = await apiFetch(`/api/cards/${selectedCard.id}`, { method: 'DELETE' });
  if (res.error) return toast(res.error, 'err');
  cards = cards.filter(c => c.id !== selectedCard.id);
  selectedCard = null;
  filterCards();
  document.getElementById('card-detail').innerHTML = '<div class="empty"><span>Sélectionne une carte</span></div>';
  showList();
  toast('Carte supprimée');
}

function getSets() {
  const sets = new Set();
  for (const c of cards) {
    const m = c.id.match(/^(.+)_(\d+)$/);
    if (m) sets.add(m[1]);
  }
  if (sets.size === 0) sets.add('CORE');
  return [...sets].sort();
}

function getAttrCategories() {
  const cats = new Set();
  for (const a of attributes) {
    if (a.categorie) cats.add(a.categorie);
  }
  return [...cats].sort();
}

function onAttrCategoryChange() {
  const sel = document.getElementById('af-cat');
  const newWrap = document.getElementById('af-cat-new-wrap');
  if (!sel || !newWrap) return;
  newWrap.style.display = sel.value === '__new__' ? '' : 'none';
  if (sel.value === '__new__') document.getElementById('af-cat-new')?.focus();
}

function getAttrCategoryValue() {
  const sel = document.getElementById('af-cat');
  if (!sel) return '';
  return sel.value === '__new__'
    ? (document.getElementById('af-cat-new')?.value.trim() || '')
    : (sel.value === '__none__' ? '' : sel.value);
}

function getNextNumForSet(setName) {
  const escaped = setName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`^${escaped}_(\\d+)$`);
  let max = 0;
  for (const c of cards) {
    const m = c.id.match(re);
    if (m) max = Math.max(max, parseInt(m[1]));
  }
  return max + 1;
}

function onSetChange() {
  const sel = document.getElementById('f-set');
  const newWrap = document.getElementById('f-set-new-wrap');
  if (!sel) return;
  if (sel.value === '__new__') {
    if (newWrap) newWrap.style.display = '';
    document.getElementById('f-set-new')?.focus();
  } else {
    if (newWrap) newWrap.style.display = 'none';
    const numInput = document.getElementById('f-num');
    if (numInput) numInput.value = getNextNumForSet(sel.value);
  }
  syncIdFromSet();
}

function syncIdFromSet() {
  const sel = document.getElementById('f-set');
  if (!sel) return;
  const setName = sel.value === '__new__'
    ? (document.getElementById('f-set-new')?.value.trim().toUpperCase() || '')
    : sel.value;
  const num = parseInt(document.getElementById('f-num')?.value) || 1;
  const idInput = document.getElementById('f-id');
  if (idInput && setName) {
    idInput.value = `${setName}_${String(num).padStart(3, '0')}`;
    localStorage.setItem('lastSet', setName);
  }
}

function openNewCard() {
  const allSets = getSets();
  const lastSet = localStorage.getItem('lastSet') || '';
  const currentSet = allSets.includes(lastSet) ? lastSet : allSets[0];
  const nextNum = getNextNumForSet(currentSet);
  const newId = `${currentSet}_${String(nextNum).padStart(3, '0')}`;

  selectedCard = {
    id: newId, name: '', type: 'monster', tier: 1, summon_type: 'normal',
    attributes: [], stats: { atk: 10, hp: 100, movement_speed: 10, attack_speed: 10, initiative: 4, range: 1 },
    power: {}, cost: { sacrifice: 0, materials: [] }, represented_ids: [], _has_illustration: false,
  };
  isNewCard = true;
  renderCardList();
  renderCardDetail();
  showDetail();
}

async function createCard() {
  const card = collectCardFromForm();
  if (!card.id || !card.name) return toast('ID et nom requis', 'err');
  const res = await apiFetch('/api/cards', { method: 'POST', body: card });
  if (res.error) return toast(res.error, 'err');
  card._has_illustration = selectedCard._has_illustration || false;
  cards.push(card);
  selectedCard = card;
  isNewCard = false;
  filterCards();
  renderCardDetail();
  toast('Carte créée');
}

function cancelNew() {
  selectedCard = null;
  isNewCard = false;
  filterCards();
  document.getElementById('card-detail').innerHTML = '<div class="empty"><span>Sélectionne une carte</span></div>';
  showList();
}

function duplicateCard() {
  if (!selectedCard) return;
  syncCardFromForm();

  // Extrait le préfixe et trouve le prochain numéro disponible pour ce préfixe
  const idMatch = selectedCard.id.match(/^(.+?)_(\d+)$/);
  const prefix = idMatch ? idMatch[1] : 'CORE';
  const padLen  = idMatch ? idMatch[2].length : 3;
  const escaped = prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const prefixRe = new RegExp(`^${escaped}_(\\d+)$`);

  const nextNum = cards.reduce((max, c) => {
    const m = c.id.match(prefixRe);
    return m ? Math.max(max, parseInt(m[1])) : max;
  }, 0) + 1;

  const newId = `${prefix}_${String(nextNum).padStart(Math.max(padLen, 3), '0')}`;

  // Deep-clone de la carte courante, nouvel ID, pas d'illustration
  selectedCard = JSON.parse(JSON.stringify(selectedCard));
  selectedCard.id = newId;
  selectedCard._has_illustration = false;

  isNewCard = true;
  renderCardList();
  renderCardDetail();

  // renderCardDetail() écrase selectedCard.id via le set-picker auto.
  // On réinjecte notre ID calculé dans le set picker, puis on sync.
  const setEl  = document.getElementById('f-set');
  const numEl  = document.getElementById('f-num');
  const newWrp = document.getElementById('f-set-new-wrap');
  if (setEl) {
    const inList = [...setEl.options].some(o => o.value === prefix);
    if (inList) {
      setEl.value = prefix;
      if (newWrp) newWrp.style.display = 'none';
    } else {
      // Le set n'existe pas encore : utilise le champ "nouveau set"
      setEl.value = '__new__';
      if (newWrp) newWrp.style.display = '';
      const newSetEl = document.getElementById('f-set-new');
      if (newSetEl) newSetEl.value = prefix;
    }
    if (numEl) numEl.value = nextNum;
    syncIdFromSet();   // met à jour f-id
    // syncIdFromSet ne touche pas selectedCard.id, on le force ici
    const finalId = document.getElementById('f-id')?.value;
    if (finalId && selectedCard) {
      selectedCard.id = finalId;
      const badge = document.getElementById('detail-card-id-display');
      if (badge) badge.textContent = finalId;
    }
  }

  showDetail();
  toast(`Carte dupliquée — modifie puis clique "Créer la carte"`);
}

async function pasteIllusUrl() {

    const text = await navigator.clipboard.readText();
    const el = document.getElementById('illus-url');
    if (el) el.value = text;
  } catch {
    toast('Accès presse-papier refusé — collez manuellement (Ctrl+V)', 'err');
  }

async function importIllustration() {
  const url = document.getElementById('illus-url').value.trim();
  if (!url) return toast('URL requise', 'err');
  closeModal();
  toast('Téléchargement en cours...', 'ok');
  const res = await apiFetch(`/api/cards/${selectedCard.id}/illustration`, { method: 'POST', body: { url } });
  if (res.error) return toast(res.error, 'err');
  selectedCard._has_illustration = true;
  const idx = cards.findIndex(c => c.id === selectedCard.id);
  if (idx !== -1) cards[idx]._has_illustration = true;
  filterCards();
  renderCardDetail();
  toast('Illustration importée');
}

async function importIllustrationFromFile() {
  const fileInput = document.getElementById('illus-file');
  const file = fileInput?.files?.[0];
  if (!file) return;
  closeModal();
  toast('Import en cours...', 'ok');
  const data = await fileToBase64(file);
  const res = await apiFetch(`/api/cards/${selectedCard.id}/illustration`, { method: 'PUT', body: { data } });
  if (res.error) return toast(res.error, 'err');
  selectedCard._has_illustration = true;
  const idx = cards.findIndex(c => c.id === selectedCard.id);
  if (idx !== -1) cards[idx]._has_illustration = true;
  filterCards();
  renderCardDetail();
  toast('Illustration importée');
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function deleteIllustration() {
  if (!confirm('Supprimer l\'illustration ?')) return;
  const res = await apiFetch(`/api/cards/${selectedCard.id}/illustration`, { method: 'DELETE' });
  if (res.error) return toast(res.error, 'err');
  selectedCard._has_illustration = false;
  const idx = cards.findIndex(c => c.id === selectedCard.id);
  if (idx !== -1) cards[idx]._has_illustration = false;
  filterCards();
  renderCardDetail();
  toast('Illustration supprimée');
}

// Attribute picker modal
let attrPickCat = '';
let attrPickSelected = new Set();

function openAttrPickModal() {
  attrPickCat = '';
  attrPickSelected = new Set();
  const cats = getAttrCategories();
  showModal(`
    <h2>Ajouter des attributs</h2>
    <input type="search" id="ap-search" placeholder="Rechercher..." autocomplete="off" oninput="renderAttrPickList()" style="width:100%;margin-bottom:8px">
    <div class="tabs" style="margin-bottom:8px;flex-wrap:wrap">
      <button class="tab ap-tab active" data-cat="" onclick="setAttrPickCat('')">Tous</button>
      ${cats.map(cat => `<button class="tab ap-tab" data-cat="${esc(cat)}" onclick="setAttrPickCat('${esc(cat)}')">${esc(cat)}</button>`).join('')}
    </div>
    <div id="ap-list" style="display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="confirmAttrPick()">Ajouter<span id="ap-count"></span></button>
    </div>
  `);
  renderAttrPickList();
}

function setAttrPickCat(cat) {
  attrPickCat = cat;
  document.querySelectorAll('.ap-tab').forEach(el => el.classList.toggle('active', el.dataset.cat === cat));
  renderAttrPickList();
}

function renderAttrPickList() {
  const current = selectedCard.attributes || [];
  const q = (document.getElementById('ap-search')?.value || '').toLowerCase();
  const list = attributes.filter(a =>
    !current.includes(a.id) &&
    (!attrPickCat || a.categorie === attrPickCat) &&
    (!q || a.name.toLowerCase().includes(q) || a.id.toLowerCase().includes(q))
  );
  document.getElementById('ap-list').innerHTML = list.map(a => `
    <div class="list-item ${attrPickSelected.has(a.id) ? 'bulk-selected' : ''}" style="border-radius:6px" onclick="toggleAttrPickSelect('${a.id}')">
      <span style="font-size:16px">${a.icon || ''}</span>
      <div><div>${esc(a.name)}</div><div style="font-size:11px;color:var(--muted);font-family:monospace">${a.id}</div></div>
    </div>
  `).join('') || '<div class="empty"><span>Aucun attribut</span></div>';
  updateAttrPickCount();
}

function toggleAttrPickSelect(aid) {
  if (attrPickSelected.has(aid)) attrPickSelected.delete(aid);
  else attrPickSelected.add(aid);
  renderAttrPickList();
}

function updateAttrPickCount() {
  const el = document.getElementById('ap-count');
  if (el) el.textContent = attrPickSelected.size ? ` (${attrPickSelected.size})` : '';
}

function confirmAttrPick() {
  if (!attrPickSelected.size) { closeModal(); return; }
  if (!selectedCard.attributes) selectedCard.attributes = [];
  syncCardFromForm();
  for (const aid of attrPickSelected) {
    if (!selectedCard.attributes.includes(aid)) selectedCard.attributes.push(aid);
  }
  closeModal();
  renderCardDetail();
}

const ATTR_EFFECT_CATEGORIES = ['normal', 'sacrifice', 'fusion', 'heritage', 'transformation'];
