.end-round-btn-arrow { position: relative; }
.end-round-btn-arrow--left { margin-right: 8px; }
.end-round-btn-arrow:not(.end-round-btn-arrow--left) { margin-left: 8px; }
.end-round-timer { text-align: center; font: 400 11px var(--font-ui); color: rgba(255,255,255,.28); letter-spacing: .05em; margin: 6px 0 10px; }

/* ── In-game Pause Menu ─────────────────────────────────────── */
@keyframes pm-ov-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pm-modal-in { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }

.pause-overlay {
  position: absolute; inset: 0;
  background: rgba(4,2,10,.8);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  z-index: 90;
  animation: pm-ov-in .2s ease forwards;
  padding: 22px;
}
.pause-modal {
  width: 100%; max-width: 448px;
  border-radius: 20px; overflow: hidden;
  background: linear-gradient(165deg, rgba(18,12,30,.99), rgba(10,7,18,.99));
  border: 1px solid rgba(203,168,90,.32);
  box-shadow: 0 0 0 1px rgba(203,168,90,.06), 0 32px 80px -16px rgba(0,0,0,.95), 0 0 80px -24px rgba(203,168,90,.30);
  animation: pm-modal-in .25s ease forwards;
}
.pause-modal--abandon {
  max-width: 408px;
  background: linear-gradient(165deg, rgba(22,10,16,.99), rgba(10,6,12,.99));
  border-color: rgba(232,84,110,.32);
  box-shadow: 0 0 0 1px rgba(232,84,110,.06), 0 32px 80px -16px rgba(0,0,0,.95), 0 0 80px -24px rgba(232,84,110,.3);
}
.pause-modal-accent {
  height: 2px;
  background: linear-gradient(90deg, transparent, #cba85a, #f6ebc8, transparent);
}
.pause-modal--abandon .pause-modal-accent {
  background: linear-gradient(90deg, transparent, #c42b4a, #f08296, transparent);
}
.pause-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 24px 16px;
}
.pause-modal-title-group { display: flex; align-items: center; gap: 13px; }
.pause-modal-icon {
  width: 42px; height: 42px; border-radius: 13px;
  background: rgba(203,168,90,.12); border: 1px solid rgba(203,168,90,.3);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.pause-modal-title { font: 700 20px var(--font-display); letter-spacing: .05em; color: var(--sf-ink-1); }
.pause-modal-subtitle { font: 600 10px var(--font-display); letter-spacing: .22em; color: var(--sf-ink-muted); margin-top: 2px; }
.pause-modal-close {
  width: 32px; height: 32px; border-radius: 9px;
  background: rgba(20,16,30,.7); border: 1px solid rgba(203,168,90,.18);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: border-color .15s, background .15s;
  min-width: 44px; min-height: 44px; width: 44px; height: 44px; border-radius: 11px;
}
.pause-modal-close:hover { border-color: rgba(203,168,90,.5); background: rgba(32,26,16,.8); }
.pause-modal-body { padding: 0 24px 26px; display: flex; flex-direction: column; gap: 10px; }
.pause-resume-btn {
  height: 54px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--grad-primary);
  font: 700 15px var(--font-display); letter-spacing: .05em; color: var(--void-950);
  cursor: pointer; box-shadow: 0 8px 30px -10px rgba(203,168,90,.70);
  transition: filter .15s; border: none; width: 100%;
}
.pause-resume-btn:hover { filter: brightness(1.08); }
.pause-section-sep { height: 1px; background: linear-gradient(90deg, transparent, rgba(203,168,90,.22), transparent); margin: 4px 0; }
.pause-danger-sep  { height: 1px; background: linear-gradient(90deg, transparent, rgba(232,84,110,.16), transparent); margin: 4px 0; }
.pause-section-label { font: 600 10px var(--font-display); letter-spacing: .22em; color: var(--sf-ink-muted); }
.pause-setting-row { display: flex; align-items: center; gap: 14px; }
.pause-setting-icon {
  width: 38px; height: 38px; border-radius: 11px;
  background: rgba(203,168,90,.10); border: 1px solid rgba(203,168,90,.2);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.pause-setting-content { flex: 1; }
.pause-setting-label-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
.pause-setting-name { font: 600 13px var(--font-body); color: var(--sf-ink-2); }
.pause-setting-val  { font: 700 11px var(--font-display); color: var(--sf-ink-muted); }
.pause-slider-track {
  position: relative; height: 4px; border-radius: 3px;
  background: rgba(203,168,90,.18); cursor: pointer; touch-action: none;
}
.pause-slider-fill {
  position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, #8a6b2b, #ddc178); pointer-events: none;
}
.pause-slider-thumb {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; border-radius: 50%;
  background: linear-gradient(135deg, #f6ebc8, #cba85a);
  box-shadow: 0 0 12px rgba(203,168,90,.7); cursor: pointer; pointer-events: none;
}
.pause-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pause-toggle-info { flex: 1; }
.pause-toggle-sub { font: 500 11px var(--font-body); color: var(--sf-ink-muted); margin-top: 2px; }
.pause-toggle {
  width: 44px; height: 24px; border-radius: 12px;
  cursor: pointer; position: relative; flex-shrink: 0;
  transition: background .2s, box-shadow .2s; min-width: 44px; min-height: 44px;
  display: flex; align-items: center;
}
.pause-toggle.on  { background: var(--grad-primary); border: 1px solid rgba(203,168,90,.45); box-shadow: 0 0 14px -4px rgba(203,168,90,.60); }
.pause-toggle.off { background: rgba(26,20,38,.9); border: 1px solid rgba(203,168,90,.22); box-shadow: none; }
.pause-toggle-dot {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 5px rgba(0,0,0,.4); transition: left .18s ease;
}
.pause-toggle.on  .pause-toggle-dot { left: calc(100% - 18px); }
.pause-toggle.off .pause-toggle-dot { left: 4px; }
.pause-abandon-btn {
  height: 50px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: rgba(232,84,110,.07); border: 1px solid rgba(232,84,110,.24);
  font: 700 13px var(--font-display); letter-spacing: .04em; color: #e07090;
  cursor: pointer; transition: background .15s, border-color .15s; width: 100%;
}
.pause-abandon-btn:hover { background: rgba(232,84,110,.14); border-color: rgba(232,84,110,.52); }
.pause-abandon-body {
  padding: 34px 28px 30px;
  display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center;
}
.pause-abandon-icon {
  width: 58px; height: 58px; border-radius: 18px;
  background: rgba(232,84,110,.1); border: 1px solid rgba(232,84,110,.3);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.pause-abandon-title { font: 700 19px var(--font-display); letter-spacing: .04em; color: #f2e8ec; margin-bottom: 8px; }
.pause-abandon-text { font: 500 13px var(--font-body); color: var(--sf-ink-muted); line-height: 1.7; max-width: 310px; }
.pause-abandon-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 2px; }
.pause-confirm-btn {
  height: 52px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(135deg, #b8243e, #e8546e);
  font: 700 14px var(--font-display); letter-spacing: .04em; color: #fff;
  cursor: pointer; box-shadow: 0 8px 28px -10px rgba(232,84,110,.85);
  border: none; transition: filter .15s; width: 100%;
}
.pause-confirm-btn:hover { filter: brightness(1.1); }
.pause-cancel-btn {
  height: 46px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(20,16,30,.7); border: 1px solid rgba(203,168,90,.2);
  font: 600 13px var(--font-display); letter-spacing: .04em; color: var(--sf-ink-2);
  cursor: pointer; transition: border-color .15s, background .15s; width: 100%;
}
.pause-cancel-btn:hover { border-color: rgba(203,168,90,.5); background: rgba(32,26,12,.7); }

@media (max-width: 480px) {
  .pause-modal-header { padding: 18px 20px 14px; }
  .pause-modal-body { padding: 0 20px 22px; gap: 9px; }
  .pause-resume-btn { height: 50px; font-size: 14px; }
  .pause-modal-icon { width: 36px; height: 36px; border-radius: 11px; }
  .pause-modal-title { font-size: 17px; }
  .pause-setting-icon { width: 34px; height: 34px; border-radius: 10px; }
  .pause-abandon-btn { height: 46px; }
  .pause-abandon-body { padding: 28px 22px 26px; gap: 16px; }
  .pause-abandon-icon { width: 50px; height: 50px; border-radius: 16px; }
  .pause-abandon-title { font-size: 16px; }
  .pause-confirm-btn { height: 48px; }
  .pause-cancel-btn { height: 42px; }
}

/* ── Shopping phase ─────────────────────────────────────────── */
@keyframes shopping-pop-in { 0%{ opacity:0; transform:scale(.9) translateY(12px); } 100%{ opacity:1; transform:scale(1) translateY(0); } }
@keyframes shopping-shine{ 0%{ transform:translateX(-180%); } 70%,100%{ transform:translateX(280%); } }
@keyframes shopping-timer-pulse{ 0%,100%{ opacity:.7; } 50%{ opacity:1; } }
@keyframes shopping-card-glow{ 0%,100%{ box-shadow:0 0 0 1px rgba(203,168,90,.35), 0 12px 32px -8px rgba(203,168,90,.40); } 50%{ box-shadow:0 0 0 1px rgba(203,168,90,.60), 0 16px 42px -6px rgba(203,168,90,.65); } }
@keyframes shopping-sparkle{ 0%,100%{ transform:scale(1) rotate(0deg); opacity:.9; } 50%{ transform:scale(1.15) rotate(15deg); opacity:1; } }

.shopping-overlay {
  position: absolute; inset: 0;
  background: radial-gradient(120% 55% at 50% 44%, rgba(60,76,130,.2), transparent 60%),
              radial-gradient(90% 45% at 50% -8%, rgba(203,168,90,.12), transparent 55%),
              rgba(4,2,10,.82);
  display: flex; align-items: center; justify-content: center;
  z-index: 48; padding: 16px;
}
.shopping-modal {
  position: relative; width: 100%; max-width: 680px; border-radius: 24px; overflow: hidden;
  animation: shopping-pop-in .4s cubic-bezier(.22,1,.36,1) both,
             shopping-card-glow 3.5s ease-in-out infinite;
}
.shopping-modal-bg {
  position: absolute; inset: 0; border-radius: 24px;
  background: radial-gradient(130% 80% at 50% -12%, rgba(203,168,90,.15), transparent 58%),
              linear-gradient(180deg, rgba(18,12,30,.98) 0%, rgba(10,7,20,.98) 100%);
  border: 1px solid rgba(203,168,90,.32);
}
.shopping-top-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, #cba85a 30%, #f6ebc8 65%, transparent);
  border-radius: 24px 24px 0 0;
}
.shopping-shine {
  position: absolute; top: 0; left: 0; width: 50%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.04), transparent);
  animation: shopping-shine 6s ease-in-out infinite; pointer-events: none;
}
.shopping-inner { position: relative; padding: 36px 36px 32px; }
.shopping-header { text-align: center; margin-bottom: 8px; }
.shopping-title-row { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.shopping-sparkle { font-size: 22px; display: inline-block; animation: shopping-sparkle 2.5s ease-in-out infinite; }
.shopping-sparkle:last-child { animation-delay: .6s; }
.shopping-title {
  font: 700 26px var(--font-display); letter-spacing: .05em;
  background: var(--grad-title);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.shopping-subtitle { font: 600 13px var(--font-body); color: var(--sf-ink-muted); letter-spacing: .06em; text-transform: uppercase; }
.shopping-timer {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  margin-bottom: 28px; animation: shopping-timer-pulse 1.2s ease-in-out infinite;
}
.shopping-timer-num { font: 700 28px var(--font-display); color: var(--gold-200); letter-spacing: .04em; }
.shopping-timer-num span { font-size: 16px; color: var(--sf-ink-ghost); margin-left: 2px; }
.shopping-magies-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.shopping-magie-card {
  position: relative; border-radius: 18px; overflow: hidden; cursor: pointer;
  border: 1px solid rgba(203,168,90,.22);
  background: linear-gradient(160deg, rgba(26,18,44,.9), rgba(14,10,24,.9));
  display: flex; flex-direction: column; touch-action: manipulation;
  transition: border-color .18s;
}
.shopping-magie-card:active { border-color: rgba(203,168,90,.65); transform: scale(.97); }
@media (hover: hover) {
  .shopping-magie-card:hover { border-color: rgba(203,168,90,.65); }
  .shopping-magie-card:hover .shopping-magie-card-hover { background: rgba(203,168,90,.07); }
}
.shopping-magie-card-hover { position: absolute; inset: 0; transition: background .18s; }
.shopping-magie-illus {
  height: 130px; flex-shrink: 0; overflow: hidden;
  background: repeating-linear-gradient(135deg, rgba(100,80,40,.25), rgba(100,80,40,.25) 4px, rgba(60,50,20,.25) 4px, rgba(60,50,20,.25) 10px);
  display: flex; align-items: center; justify-content: center;
  border-bottom: 1px solid rgba(203,168,90,.15);
}
.shopping-magie-illus img { width: 100%; height: 100%; object-fit: cover; }
.shopping-magie-illus-placeholder { text-align: center; opacity: .45; }
.shopping-magie-illus-icon { font-size: 32px; margin-bottom: 4px; }
.shopping-magie-illus-label { font: 600 9px var(--font-display); letter-spacing: .14em; color: var(--sf-ink-muted); }
.shopping-magie-body { padding: 14px 14px 16px; flex: 1; }
.shopping-magie-name { font: 700 15px var(--font-display); color: var(--sf-ink-1); letter-spacing: .02em; margin-bottom: 5px; }
.shopping-magie-effect { font: 500 12px var(--font-body); color: var(--sf-ink-muted); line-height: 1.5; }
.shopping-magie-bar { height: 2px; background: linear-gradient(90deg, transparent, rgba(203,168,90,.6), transparent); }
.shopping-skip { text-align: center; margin-top: 20px; }
.shopping-skip-btn {
  font: 600 12px var(--font-body); color: var(--sf-ink-ghost); cursor: pointer;
  letter-spacing: .04em; background: none; border: none; padding: 8px 16px;
  min-height: 44px; display: inline-flex; align-items: center; touch-action: manipulation;
  transition: color .15s;
}
@media (hover: hover) { .shopping-skip-btn:hover { color: var(--sf-ink-faint); } }
@media (max-width: 480px) {
  .shopping-inner { padding: 24px 14px 20px; }
  .shopping-magies-row { gap: 8px; }
  .shopping-magie-illus { height: 90px; }
  .shopping-magie-body { padding: 10px 10px 12px; }
  .shopping-magie-name { font-size: 13px; }
  .shopping-magie-effect { font-size: 11px; }
  .shopping-title { font-size: 20px; }
  .shopping-timer-num { font-size: 22px; }
}
.shopping-select-banner {
  position: absolute; top: 0; left: 0; right: 0; z-index: 48;
  background: var(--grad-primary); color: #fff;
  text-align: center; padding: 10px 16px;
  font-weight: 700; font-size: .88rem;
  box-shadow: 0 2px 16px rgba(203,168,90,.35);
}

/* ── Summon Options Modal ────────────────────────────────────── */
@keyframes si-in { 0% { opacity:0; transform:translate(-50%,-50%) scale(.93); } 100% { opacity:1; transform:translate(-50%,-50%) scale(1); } }
.si-overlay {
  position: absolute; inset: 0; z-index: 55;
  background: rgba(3,2,8,.78);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.si-modal {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: min(420px, calc(100% - 32px));
  border-radius: 20px; overflow: hidden;
  background: radial-gradient(120% 80% at 50% -10%, rgba(203,168,90,.15), transparent 60%),
              linear-gradient(160deg, #13111f, #0c0a15 62%, #0d0a16);
  border: 1px solid rgba(203,168,90,.30);
  box-shadow: 0 44px 120px -18px rgba(0,0,0,.9);
  color: #ece9f5;
  animation: si-in .28s cubic-bezier(.2,.9,.3,1) both;
}
.si-modal-accent {
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, #7c9dff, #a78bfa, #ff7eb6, transparent);
  opacity: .7;
}
.si-modal-header { display: flex; align-items: center; gap: 12px; padding: 16px 16px 14px; }
.si-modal-thumb {
  position: relative; width: 40px; height: 56px; flex: none;
  border-radius: 8px; overflow: hidden;
  background: repeating-linear-gradient(135deg, #241a3c, #241a3c 5px, #2c2148 5px, #2c2148 10px);
  border: 1.5px solid;
}
.si-modal-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.si-modal-thumb-tier {
  position: absolute; top: 2px; left: 2px; padding: 0 3px;
  border-radius: 4px; background: rgba(10,8,18,.65); border: 1px solid;
  font: 800 6px var(--font-display, sans-serif); line-height: 1.7; z-index: 1;
}
.si-modal-header-text { flex: 1; min-width: 0; }
.si-modal-header-label {
  font: 600 8px var(--font-display, sans-serif);
  letter-spacing: .18em; color: #8a7fb0; margin-bottom: 2px;
}
.si-modal-header-name {
  font: 800 18px var(--font-display, sans-serif);
  color: #f6f2ff; line-height: 1.1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.si-modal-close {
  width: 30px; height: 30px; flex: none; min-width: 30px; min-height: 30px;
  border-radius: 9px; background: rgba(20,16,30,.7);
  border: 1px solid rgba(203,168,90,.22);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #b9afd4;
  transition: border-color .15s, color .15s; touch-action: manipulation;
}
.si-modal-close:active { border-color: rgba(232,84,110,.55); color: #e85a6e; }
@media (hover:hover) { .si-modal-close:hover { border-color: rgba(232,84,110,.55); color: #e85a6e; } }
.si-modal-rows { display: flex; flex-direction: column; gap: 9px; padding: 0 14px 10px; }
.si-row {
  position: relative; display: flex; align-items: center; gap: 12px;
  padding: 13px 12px; border-radius: 14px; width: 100%;
  background: rgba(20,16,30,.6); border: 1.5px solid rgba(203,168,90,.20);
  cursor: pointer; text-align: left; touch-action: manipulation;
  transition: transform .12s ease;
}
.si-row:active { transform: translateX(2px); }
@media (hover:hover) { .si-row:hover { transform: translateX(2px); } }
.si-row-icon {
  width: 42px; height: 42px; flex: none; border-radius: 12px; border: 1px solid;
  display: flex; align-items: center; justify-content: center;
}
.si-row-body { flex: 1; min-width: 0; }
.si-row-name { font: 700 16px var(--font-display, sans-serif); line-height: 1; }
.si-row-prereq {
  display: flex; align-items: center; gap: 6px; flex: none; max-width: 46%;
  padding: 4px 10px 4px 4px; border-radius: 9px;
  background: rgba(16,12,26,.8); border: 1px solid rgba(203,168,90,.18);
}
.si-row-tier {
  padding: 1px 4px; border-radius: 5px; flex: none;
  background: rgba(10,8,18,.7); border: 1px solid;
  font: 800 7px var(--font-display, sans-serif);
}
.si-row-prereq-text {
  font: 600 11px var(--font-body, sans-serif); color: #cbc2e0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.si-modal-footer { display: flex; justify-content: center; padding: 0 14px 16px; }
.si-modal-cancel {
  padding: 10px 24px; border-radius: 10px; min-height: var(--touch-target, 44px);
  font: 600 12px var(--font-display, sans-serif);
  letter-spacing: .04em; color: #9b91ba; cursor: pointer;
  background: none; border: none; display: flex; align-items: center;
  touch-action: manipulation; transition: color .15s;
}
.si-modal-cancel:active { color: #cbc2e0; }
@media (hover:hover) { .si-modal-cancel:hover { color: #cbc2e0; } }

/* ── Power cast label (toast flottant au-dessus de l'unité) ── */
@keyframes power-toast-anim {
  0%   { opacity: 0; transform: translate(-50%, 0); }
  15%  { opacity: 1; transform: translate(-50%, -6px); }
  70%  { opacity: 1; transform: translate(-50%, -12px); }
  100% { opacity: 0; transform: translate(-50%, -20px); }
}
.power-cast-label {
  position: fixed;
  z-index: 70;
  pointer-events: none;
  background: var(--gold-600);
  color: var(--void-950);
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
  box-shadow: 0 2px 14px rgba(203,168,90,.6);
  animation: power-toast-anim 1.8s ease forwards;
  font-family: var(--font-display);
}

/* ── Attribute activation flash ── */
@keyframes attr-flash-anim {
  0%,100% { transform: scale(1); box-shadow: none; }
  35%     { transform: scale(1.35); box-shadow: 0 0 18px 5px var(--sf-violet-700); border-color: var(--sf-violet-700); }
  65%     { transform: scale(1.15); box-shadow: 0 0 9px 2px var(--sf-violet-500); }
}
.attr-flash {
  animation: attr-flash-anim 0.55s ease;
  position: relative;
  z-index: 1;
}



/* ── Mobile: prevent iOS long-press from saving images ── */
img {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  pointer-events: none;
}
/* Re-enable pointer-events on interactive elements that wrap images */
.hand-card, .card-item, .unit-card, .deck-slot.filled, .graveyard-units .unit-card, .db-lib-card, .db-slot.filled {
  pointer-events: auto;
}
/* Le board 3D gère tous les pointer events via le canvas WebGL */
.game3d-3d .unit-card {
  pointer-events: none;
  cursor: default;
}
.game3d-wrap, .game3d-3d {
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}


/* ── DeckBuilder browser: cards use hand-card style but are square ── */
.card-browser-panel .card-item.hand-card {
  width: 100%;
  height: unset;
  aspect-ratio: 1;
  min-height: unset;
  flex-shrink: 0;
}

/* ── TestBench browser card: portrait via explicit wrapper ── */
.tb-browser-card {
  width: 100%;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  border: none; background: transparent; overflow: visible;
  position: relative; aspect-ratio: 5 / 7;
  filter: drop-shadow(0 2px 8px var(--hc-glow, rgba(203,168,90,.3)));
  --oc: 10px;
  container-type: inline-size;
  transition: filter var(--transition-fast), transform var(--transition-fast);
}
.tb-browser-card.selected {
  filter: drop-shadow(0 0 14px var(--hc-glow, rgba(203,168,90,.9))) drop-shadow(0 6px 18px var(--hc-glow, rgba(203,168,90,.7)));
}
.tb-browser-card:hover { transform: scale(1.04); }
/* ── TestBench layout ── */
.tb-layout {
  flex: 1;
  display: flex;
  overflow: hidden;
  gap: 0;
}
.tb-board-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
.tb-browser-col {
  width: 200px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  overflow: hidden;
  background: var(--surface);
  min-height: 0;
}
.tb-filters {
  padding: 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tb-filters .summon-filter-bar { margin-bottom: 4px; }
.tb-filters .search-input { margin-bottom: 0; font-size: 12px; }
.tb-browser-col .card-grid {
  padding: 6px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  flex: 1;
  min-height: 0;
  align-content: flex-start;
}
.tb-browser-col .card-grid > .card-item {
  flex: 0 0 calc(50% - 4px);
}
.tb-side-toggle {
  display: flex;
  gap: 0;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.tb-side-btn {
  flex: 1;
  padding: 6px;
  background: var(--surface);
  border: none;
  color: var(--muted);
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  border-bottom: 2px solid transparent;
  transition: all var(--transition-fast);
}
.tb-side-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: #1c1840; }
/* Keep attribute panel always in layout to avoid board shift when first unit is placed */
.tb-board-col .attribute-panel:empty { display: flex; min-height: 44px; }

/* Terrain selector row (TestBench) */
.tb-terrain-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.tb-terrain-select {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 4px 6px;
  font-size: 12px;
  min-height: var(--touch-target);
  cursor: pointer;
  font-family: inherit;
}
.tb-terrain-info {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  padding: 2px 7px;
  min-height: var(--touch-target);
  min-width: var(--touch-target);
  flex-shrink: 0;
}
.tb-terrain-info:active { background: var(--surface2); }

@media (max-width: 480px) {
  .tb-browser-col { width: 150px; }
}

/* Barre de vie et hexagone d'équipe dans les limites du cadre (POC et Jouer 3D) */
.poc3d-card-wrap .unit-bars {
  bottom: 6px;
  left: 6px;
  right: 6px;
}
</style>
